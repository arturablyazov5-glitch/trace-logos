<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <script>window.__LANG__='en';</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База знаний</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="icon" href="/favicon.ico" sizes="32x32 16x16">

  <link rel="stylesheet" href="/css/tokens.css?v=20260910">
  <link rel="stylesheet" href="/css/blog.css?v=20260910">
  <link rel="stylesheet" href="/css/kb.css?v=20260910">
</head>
<body class="kb-body">

  <div class="kb-gate" id="kb-gate" hidden>
    <div class="kb-gate-card">
      <div class="kb-gate-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="kb-gate-title">База знаний</div>
      <div class="kb-gate-sub">Закрытый раздел — введите код доступа</div>
      <form class="kb-gate-form" id="kb-gate-form" autocomplete="off">
        <input class="kb-gate-input" id="kb-gate-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="16" placeholder="••••" autofocus>
        <div class="kb-gate-error" id="kb-gate-error"></div>
        <button type="submit" class="kb-gate-btn">Войти</button>
      </form>
    </div>
  </div>

  <div class="kb-app" id="kb-app">
    <aside class="kb-sidebar" id="kb-sidebar">
      <div class="kb-sidebar-head">
        <span class="kb-sidebar-logo" aria-hidden="true">K</span>
        <span class="kb-sidebar-title">База знаний</span>
      </div>
      <div class="kb-search-wrap">
        <input class="kb-search" id="kb-search" type="text" placeholder="Поиск по базе...">
      </div>
      <nav class="kb-tree" id="kb-tree" aria-label="Дерево разделов"></nav>
    </aside>

    <div class="kb-main">
      <div class="kb-topbar">
        <button class="kb-burger" id="kb-burger" type="button" aria-label="Меню">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="kb-crumbs" id="kb-crumbs"></div>
      </div>
      <div class="kb-content" id="kb-content"></div>
    </div>
  </div>

  <script type="module" src="/js/kb.js?v=20260910"></script>
</body>
</html>
