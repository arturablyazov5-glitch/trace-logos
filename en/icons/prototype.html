<script>
const state = {
  manifest: null,
  packs: [],
  active: 'all',
  query: '',
  activeChips: new Set(),
  fav: new Set(['outline']),
  cart: new Set(),
  global: { color: '#e5e5e5', stroke: 2, size: 24 },
  raw: new Map(),      // file -> raw svg text
  perIcon: new Map(),  // file -> {color, stroke, size, multiMap}
};
const PRESETS = ['#e5e5e5','#111111','#5b8cff','#22c55e','#ef4444','#f59e0b','#a855f7','#ec4899'];

const $ = (s, r=document) => r.querySelector(s);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }

async function rawSvg(file){
  if (state.raw.has(file)) return state.raw.get(file);
  const txt = await fetch('../assets/icons/svgs/'+file).then(r=>r.text());
  state.raw.set(file, txt);
  return txt;
}
function allIcons(){
  const out=[];
  for(const p of state.packs) for(const g of p.subgroups) for(const it of g.items)
    out.push({...it, pack:p.id, packLabel:p.label, group:g.name});
  return out;
}
function iconsFor(packId){
  if(packId==='all') return allIcons();
  const p = state.packs.find(x=>x.id===packId); if(!p) return [];
  const out=[];
  for(const g of p.subgroups) for(const it of g.items) out.push({...it, pack:p.id, packLabel:p.label, group:g.name});
  return out;
}

// apply current edits to a live <svg> element
function applyEdits(svg, icon){
  const e = state.perIcon.get(icon.file) || state.global;
  svg.setAttribute('width', e.size); svg.setAttribute('height', e.size);
  if(icon.colorType==='mono'){ svg.style.color = e.color; }
  else if(e.multiMap){ for(const [from,to] of Object.entries(e.multiMap)) recolorMulti(svg, from, to); }
  if(icon.strokeEditable){ svg.setAttribute('stroke-width', e.stroke); }
}
function recolorMulti(svg, from, to){
  svg.querySelectorAll('[fill]').forEach(n=>{ if(n.getAttribute('fill').toLowerCase()===from.toLowerCase()) n.setAttribute('fill', to); });
}
async function makeSvg(icon){
  const txt = await rawSvg(icon.file);
  const svg = new DOMParser().parseFromString(txt,'image/svg+xml').documentElement;
  applyEdits(svg, icon);
  return svg;
}

// ── Sidebar ──
function renderPacks(){
  const box = $('#packs'); box.innerHTML='';
  const f = $('#pack-filter').value.toLowerCase();
  const total = allIcons().length;
  const mk = (id,label,count,thumb,starable)=>{
    const d = el('div','pack'+(state.active===id?' active':''));
    d.innerHTML = `<div class="pack-thumb">${thumb}</div><div class="pack-name">${label}</div><div class="pack-count">${count}</div>`;
    if(starable){ const s=el('span','pack-star'+(state.fav.has(id)?' on':'')); s.textContent='★';
      s.onclick=ev=>{ev.stopPropagation(); state.fav.has(id)?state.fav.delete(id):state.fav.add(id); renderPacks();}; d.appendChild(s); }
    d.onclick=()=>{ state.active=id; state.activeChips.clear(); render(); };
    return d;
  };
  // "Все"
  if(!f) box.appendChild(mk('all','Все',total,'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>',false));
  const favs = state.packs.filter(p=>state.fav.has(p.id) && p.label.toLowerCase().includes(f));
  const rest = state.packs.filter(p=>!state.fav.has(p.id) && p.label.toLowerCase().includes(f));
  const cnt = p => p.subgroups.reduce((a,g)=>a+g.items.length,0);
  const thumb = p => `<svg viewBox="0 0 24 24" fill="${p.style==='outline'?'none':'currentColor'}" stroke="${p.style==='outline'?'currentColor':'none'}" stroke-width="2"><circle cx="12" cy="12" r="${p.style==='outline'?8:7}"/></svg>`;
  if(favs.length){ const l=el('div','side-label'); l.textContent='★ Избранные'; box.appendChild(l);
    favs.forEach(p=>box.appendChild(mk(p.id,p.label,cnt(p),thumb(p),true))); }
  const l2=el('div','side-label'); l2.textContent='Все паки'; box.appendChild(l2);
  rest.forEach(p=>box.appendChild(mk(p.id,p.label,cnt(p),thumb(p),true)));
}

// ── Chips (subgroups) ──
function renderChips(){
  const box=$('#chips'); box.innerHTML='';
  if(state.active==='all'){ box.style.display='none'; return; }
  box.style.display='flex';
  const p=state.packs.find(x=>x.id===state.active);
  p.subgroups.forEach(g=>{
    const c=el('div','chip'+(state.activeChips.has(g.name)?' on':''));
    c.textContent=g.name;
    c.onclick=()=>{ state.activeChips.has(g.name)?state.activeChips.delete(g.name):state.activeChips.add(g.name); render(); };
    box.appendChild(c);
  });
}

// ── Grid ──
async function renderGrid(){
  const grid=$('#grid'); grid.innerHTML='';
  let icons = iconsFor(state.active);
  if(state.query){ const q=state.query.toLowerCase(); icons=icons.filter(i=>i.name.toLowerCase().includes(q)); }
  if(state.activeChips.size) icons=icons.filter(i=>state.activeChips.has(i.group));

  // group by pack+subgroup into sections
  const sections=new Map();
  for(const i of icons){ const k=i.pack+'·'+i.group; if(!sections.has(k)) sections.set(k,{pack:i.packLabel,group:i.group,items:[]}); sections.get(k).items.push(i); }

  for(const sec of sections.values()){
    const s=el('div','section');
    const h=el('div','section-head');
    h.innerHTML=`<span class="pk">${sec.pack} ·</span><span class="nm">${sec.group}</span><span class="ct">${sec.items.length}</span>`;
    s.appendChild(h);
    const g=el('div','grid');
    for(const icon of sec.items){
      const card=el('div','card'+(state.cart.has(icon.file)?' incart':''));
      card.innerHTML=`<span class="badge">${icon.pack}:</span><span class="nm">${icon.name}</span>
        <span class="quick">
          <span class="qbtn" data-act="copy" title="Копировать SVG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span>
          <span class="qbtn" data-act="cart" title="В корзину"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span>
        </span>`;
      const svg=await makeSvg(icon); card.insertBefore(svg, card.firstChild);
      card.onclick=ev=>{
        const act=ev.target.closest('[data-act]')?.dataset.act;
        if(act==='copy'){ ev.stopPropagation(); copyIcon(icon); }
        else if(act==='cart'){ ev.stopPropagation(); toggleCart(icon, card); }
        else openDetail(icon);
      };
      g.appendChild(card);
    }
    s.appendChild(g); grid.appendChild(s);
  }
  if(!sections.size) grid.innerHTML='<div style="color:var(--text-5);padding:40px;text-align:center">Ничего не найдено</div>';
}

// ── Detail ──
let current=null;
async function openDetail(icon){
  current=icon;
  const d=$('#detail'); d.classList.add('open');
  const e = state.perIcon.get(icon.file) || {...state.global, multiMap:null};
  const svg=await makeSvg(icon);
  const pack=state.packs.find(p=>p.id===icon.pack);

  let colorBlock='';
  if(icon.colorType==='mono'){
    colorBlock=`<div class="d-block"><div class="d-label">Цвет</div>
      <div class="colrow"><button class="swatch" style="background:${e.color}"><input type="color" id="d-color" value="${e.color}"></button><span class="hex">${e.color.toUpperCase()}</span></div>
      <div class="presets">${PRESETS.map(c=>`<span class="preset" data-c="${c}" style="background:${c}"></span>`).join('')}</div></div>`;
  } else {
    const raw=await rawSvg(icon.file);
    const cols=[...new Set([...raw.matchAll(/fill="(#[0-9a-fA-F]{3,6})"/g)].map(m=>m[1]))];
    const mm=e.multiMap||{};
    colorBlock=`<div class="d-block"><div class="d-label">Цвета · ${cols.length}</div>`+
      cols.map(c=>{const cur=mm[c]||c;return `<div class="colrow"><button class="swatch" style="background:${cur}"><input type="color" class="d-multi" data-from="${c}" value="${cur}"></button><span class="hex">${cur.toUpperCase()}</span></div>`;}).join('')+`</div>`;
  }

  const strokeBlock = icon.strokeEditable
    ? `<div class="d-block"><div class="d-label">Толщина обводки <span>${(e.stroke).toFixed(2)} px</span></div>
        <div class="slider-row"><input type="range" id="d-stroke" min="0.5" max="3" step="0.25" value="${e.stroke}"></div></div>`
    : `<div class="d-block"><div class="d-label">Толщина обводки</div>
        <div class="disabled-note">⌗ Иконка заливочная (filled) — толщина обводки к ней неприменима.</div></div>`;

  const variantBlock = pack.style!=='color'
    ? `<div class="d-block first"><div class="d-label">Вариант</div>
        <div class="seg"><button class="${pack.style==='outline'?'on':''}">Outline</button><button class="${pack.style==='solid'?'on':''}">Solid</button></div></div>` : '';

  d.innerHTML=`
    <div class="d-head"><span class="d-id">${icon.pack}:${icon.name}</span>
      <button class="d-close" onclick="document.getElementById('detail').classList.remove('open')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="d-preview" id="d-preview"></div>
    <div class="d-name">${icon.name}</div>
    <div class="d-sub">${icon.packLabel} · ${icon.group}</div>
    ${variantBlock}
    ${colorBlock}
    ${strokeBlock}
    <div class="d-block"><div class="d-label">Размер <span>${e.size} px</span></div>
      <div class="slider-row"><input type="range" id="d-size" min="14" max="64" step="2" value="${e.size}"></div></div>
    <div class="d-actions">
      <button class="btn primary" id="d-copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Скопировать SVG</button>
      <button class="btn" id="d-dl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> SVG</button>
      <button class="btn" id="d-cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> В корзину</button>
    </div>`;
  $('#d-preview').appendChild(svg);

  function ed(){ const o=state.perIcon.get(icon.file)||{...state.global,multiMap:null}; return o; }
  function setEd(patch){ const o={...(state.perIcon.get(icon.file)||{...state.global,multiMap:null}),...patch}; state.perIcon.set(icon.file,o); refreshPreview(); renderGrid(); }
  function refreshPreview(){ makeSvg(icon).then(s=>{ const p=$('#d-preview'); p.innerHTML=''; p.appendChild(s); }); }

  $('#d-color')?.addEventListener('input',ev=>{ openDetailColor(ev.target.value); });
  function openDetailColor(v){ setEd({color:v}); ev=null; const sw=$('#d-color').closest('.swatch'); sw.style.background=v; sw.nextElementSibling.textContent=v.toUpperCase(); }
  d.querySelectorAll('.preset').forEach(p=>p.onclick=()=>{ const v=p.dataset.c; const inp=$('#d-color'); if(inp){inp.value=v; openDetailColor(v);} });
  d.querySelectorAll('.d-multi').forEach(inp=>inp.addEventListener('input',ev=>{
    const o=ed(); const mm={...(o.multiMap||{})}; mm[ev.target.dataset.from]=ev.target.value; setEd({multiMap:mm});
    const sw=ev.target.closest('.swatch'); sw.style.background=ev.target.value; sw.nextElementSibling.textContent=ev.target.value.toUpperCase();
  }));
  $('#d-stroke')?.addEventListener('input',ev=>{ setEd({stroke:+ev.target.value}); ev.target.closest('.d-block').querySelector('span').textContent=(+ev.target.value).toFixed(2)+' px'; });
  $('#d-size')?.addEventListener('input',ev=>{ setEd({size:+ev.target.value}); ev.target.closest('.d-block').querySelector('span').textContent=ev.target.value+' px'; });
  $('#d-copy').onclick=()=>copyIcon(icon);
  $('#d-dl').onclick=()=>downloadIcon(icon);
  $('#d-cart').onclick=()=>{ toggleCart(icon); };
}

// ── Serialize with baked edits ──
async function bakedSvg(icon){
  const svg=await makeSvg(icon);
  if(icon.colorType==='mono'){ // bake currentColor → concrete
    const c=(state.perIcon.get(icon.file)||state.global).color;
    svg.removeAttribute('style'); svg.setAttribute(icon.strokeEditable?'stroke':'fill', c);
  }
  return new XMLSerializer().serializeToString(svg);
}
async function copyIcon(icon){ const s=await bakedSvg(icon); try{ await navigator.clipboard.writeText(s); toast('SVG скопирован — '+icon.name); }catch{ toast('SVG готов (clipboard заблокирован)'); } }
async function downloadIcon(icon){ const s=await bakedSvg(icon); const b=new Blob([s],{type:'image/svg+xml'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=icon.name+'.svg'; a.click(); toast('Скачано '+icon.name+'.svg'); }

// ── Cart ──
function toggleCart(icon, card){
  if(state.cart.has(icon.file)){ state.cart.delete(icon.file); toast('Убрано из корзины'); }
  else { state.cart.add(icon.file); toast('В корзине: '+state.cart.size); }
  if(card) card.classList.toggle('incart', state.cart.has(icon.file)); else renderGrid();
  const n=state.cart.size; $('#fab-n').textContent=n; $('#fab').classList.toggle('show', n>0);
}

// ── Global custom bar ──
function bindGlobal(){
  $('#g-color').addEventListener('input',e=>{ state.global.color=e.target.value; $('#g-swatch').style.background=e.target.value; reapplyGlobal(); });
  $('#g-stroke').addEventListener('input',e=>{ state.global.stroke=+e.target.value; $('#g-stroke-v').textContent=(+e.target.value).toFixed(1); reapplyGlobal(); });
  $('#sz-minus').onclick=()=>{ state.global.size=Math.max(14,state.global.size-2); $('#g-size-v').textContent=state.global.size; reapplyGlobal(); };
  $('#sz-plus').onclick=()=>{ state.global.size=Math.min(64,state.global.size+2); $('#g-size-v').textContent=state.global.size; reapplyGlobal(); };
  $('#g-reset').onclick=()=>{ state.perIcon.clear(); state.global={color:'#e5e5e5',stroke:2,size:24};
    $('#g-color').value='#e5e5e5'; $('#g-swatch').style.background='#e5e5e5'; $('#g-stroke').value=2; $('#g-stroke-v').textContent='2.0'; $('#g-size-v').textContent='24'; renderGrid(); toast('Правки сброшены'); };
  $('#pack-filter').addEventListener('input',renderPacks);
  $('#search').addEventListener('input',e=>{ state.query=e.target.value; renderGrid(); updateCrumb(); });
  $('#fab').onclick=()=>toast('Корзина: '+state.cart.size+' — здесь будет батч-экспорт ZIP / спрайт');
  document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#search').focus();} if(e.key==='Escape')$('#detail').classList.remove('open'); });
}
function reapplyGlobal(){ renderGrid(); } // global edits apply to icons without per-icon override

function updateCrumb(){
  const p=state.active==='all'?'Все паки':state.packs.find(x=>x.id===state.active)?.label;
  $('#crumb').innerHTML = state.query ? `Поиск: <b>${state.query}</b>` : `<b>${p}</b>`;
}
function render(){ renderPacks(); renderChips(); renderGrid(); updateCrumb(); }

// ── Boot ──
(async()=>{
  state.manifest = await fetch('../assets/icons/demo-manifest.json').then(r=>r.json());
  state.packs = state.manifest.packs;
  state.active = state.packs[0].id; // start in first pack (Outline)
  bindGlobal(); render();
})();
</script>
</body>
</html>
