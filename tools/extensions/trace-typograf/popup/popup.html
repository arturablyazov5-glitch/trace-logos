<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trace Typograf</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- Спрайт иконок (lucide, инлайн) — тот же приём, что в ui.html Figma-плагина
     tools/figma-plugins/typograf: один <symbol> на файл вместо инлайн-SVG
     в каждом месте использования. -->
<svg style="display:none">
  <symbol id="icon-type" viewBox="0 0 24 24">
    <path d="M12 4v16"/>
    <path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"/>
    <path d="M9 20h6"/>
  </symbol>
</svg>

<div id="root">

  <!-- Карточка контекста — тот же .scope-card, что в Figma-плагине Trace
       Typograf (аватар с иконкой + заголовок + подпись), вместо голого
       <h1>+<p>. Название расширения задаёт нативный заголовок окна Chrome,
       здесь не дублируется. -->
  <div class="scope-card">
    <span class="scope-avatar"><svg class="icon"><use href="#icon-type"/></svg></span>
    <div class="scope-body">
      <div class="scope-title">Расставить типографику</div>
      <div class="scope-meta">Кликните в текстовое поле на странице, затем нажмите кнопку</div>
    </div>
  </div>

  <div class="footer">
    <button id="apply-btn" class="btn-primary" type="button">Расставить типограф</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </div>

  <!-- Промо Trace Logo's — тот же .tlp, что запекается в ui.html Figma-
       плагинов (tools/figma-plugins/_shared/promo-banner.html). Попап
       расширения не песочница Figma — обычные <a target="_blank">. -->
  <aside class="tlp">
    <a class="tlp-head" href="https://trace-logos.ru/?utm_source=trace-typograf-extension&amp;utm_medium=extension" target="_blank" rel="noopener noreferrer">
      <img class="tlp-icon" src="promo-assets/trace-logos.svg" alt="" />
      <span class="tlp-body">
        <span class="tlp-title">Trace Logo's</span>
        <span class="tlp-sub">730 логотипов и 1918 эмодзи<br>в SVG и PNG</span>
      </span>
      <span class="tlp-arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <div class="tlp-strip">
      <img class="tlp-logo" src="promo-assets/ozon.svg" alt="Ozon" title="Ozon" />
      <img class="tlp-logo" src="promo-assets/wildberries.svg" alt="Wildberries" title="Wildberries" />
      <img class="tlp-logo" src="promo-assets/2gis.svg" alt="2ГИС" title="2ГИС" />
      <img class="tlp-logo" src="promo-assets/yandex.svg" alt="Яндекс" title="Яндекс" />
      <img class="tlp-logo" src="promo-assets/sber.svg" alt="Сбер" title="Сбер" />
      <img class="tlp-logo" src="promo-assets/vk.svg" alt="ВКонтакте" title="ВКонтакте" />
      <span class="tlp-more">и ещё<br>724</span>
    </div>
    <a class="tlp-donate" href="https://app.lava.top/products/6f3c8efd-27c3-41a8-acb1-559b83ea3b46/d9261f0e-d716-418c-b91d-764e83f1c01c?currency=RUB" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Поддержать автора
    </a>
  </aside>

</div>

<script src="popup.js"></script>
</body>
</html>
