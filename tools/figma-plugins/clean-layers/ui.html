<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  /* ── Цвета — тёмная тема, токены сайта Trace Logo's (см. css/tokens.css в
     корне репозитория: --bg/--bg-card/--accent/--text-N и т.д., значения
     скопированы буквально, чтобы плагин читался как продолжение сайта, а
     не как дефолтная светлая Figma-панель). Структура разметки/логики —
     как в photo-editor/ui.html (обоснования [hidden] c !important, #root
     вместо body для высоты и т.д. см. там, не дублируем). Светлая версия
     этого же плагина (до 2026-08-16) держалась 1-в-1 с photo-editor —
     photo-editor остался светлым, эта смена темы затронула только
     clean-layers, по прямой просьбе пользователя. ── */
  :root {
    --accent: #8a6bff;
    --accent-soft: rgba(138, 107, 255, 0.14);
    --danger: #e5484d;
    --danger-soft: rgba(229, 72, 77, 0.14);
    --warn: #f5b544;
    --warn-soft: rgba(245, 181, 68, 0.14);
    --text: #e5e5e5;
    --text-dim: #888;
    --text-faint: #666;
    --page-bg: #111111;
    --card-bg: #161616;
    --border: #222222;
    --chip-bg: #252525; /* нейтральный тёмный чип для count-badge — var(--text) теперь светлый, для фона больше не годится */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--page-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    font-size: 12px;
    color: var(--text);
  }
  button { font-family: inherit; border: none; background: none; padding: 0; margin: 0; }
  #root { display: flex; flex-direction: column; }

  .icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .screen { display: flex; flex-direction: column; gap: 18px; }

  /* ── Экран 1: пустой стейт ──
     1-в-1 с photo-editor — область действия здесь только явное выделение
     (см. code.js), без него инструментам нечего делать, показывать их
     задизейбленными смысла нет. */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    justify-content: center;
    gap: 12px;
    min-height: 210px;
    padding: 24px 16px;
  }
  .empty-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: float 2.8s ease-in-out infinite;
  }
  .empty-icon .icon { width: 24px; height: 24px; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .empty-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .empty-hint {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
    max-width: 250px;
    margin-top: 4px;
  }

  /* ── Экран 2: есть выделение — карточка + инструменты ── */
  .scope-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }
  .scope-avatar {
    position: relative;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 11px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scope-avatar .icon { width: 17px; height: 17px; }
  .count-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    /* var(--text) в светлой теме была тёмной — годилась и как фон бейджа
       "инверсией". В тёмной теме var(--text) сам светлый, для фона больше
       не подходит — отдельный нейтральный тёмный чип, светлее аватара и
       card-bg, чтобы бейдж читался поверх обоих. */
    background: var(--chip-bg);
    color: #fff;
    border: 2px solid var(--card-bg);
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scope-body { min-width: 0; flex: 1; }
  .scope-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .scope-meta { margin-top: 2px; font-size: 11px; color: var(--text-dim); }

  .banner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.35;
  }
  .banner .icon { width: 14px; height: 14px; flex-shrink: 0; }
  .banner.success { background: var(--accent-soft); color: var(--accent); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.error { background: var(--danger-soft); color: var(--danger); }

  .section { display: flex; flex-direction: column; gap: 9px; }
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 1px 2px;
  }

  .tool-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 14px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.08s, opacity 0.12s;
  }
  .tool-row:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
  .tool-row:active:not(:disabled) { transform: scale(0.98); }
  .tool-row:disabled { cursor: progress; opacity: 0.45; }
  /* Отдельно от "занято работой" (курсор progress выше) — "нечего делать":
     нашли 0 удалимых слоёв/заливок, кнопка недоступна не потому что что-то
     считается, а потому что действие бессмысленно. Выше по специфичности,
     чем общий .tool-row:disabled — переопределяет курсор. */
  .tool-row.is-unavailable:disabled { cursor: not-allowed; }
  .tool-row-icon {
    position: relative;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    transition: color 0.12s;
  }
  .tool-row-body { min-width: 0; flex: 1; }
  .tool-row-title { display: block; font-size: 13px; font-weight: 600; color: var(--text); }
  .tool-row-desc { display: block; font-size: 11px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }
  .tool-row-chevron { color: var(--text-faint); flex-shrink: 0; display: flex; }
  .tool-row-chevron .icon { width: 14px; height: 14px; }

  .spinner {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid currentColor;
    border-top-color: transparent;
    opacity: 0.9;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Спрайт иконок (lucide, инлайн — networkAccess: none, никаких CDN) -->
<svg style="display:none">
  <!-- layers (lucide) — область действия и сам инструмент "скрытые слои" -->
  <symbol id="icon-layers" viewBox="0 0 24 24">
    <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.91a1 1 0 0 0 0-1.83Z"/>
    <path d="m6.08 9.5-3.5 1.6a1 1 0 0 0 0 1.81l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83l-3.5-1.59"/>
    <path d="m6.08 14.5-3.5 1.6a1 1 0 0 0 0 1.81l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83l-3.5-1.59"/>
  </symbol>
  <!-- eye-off (lucide) — инструмент "удалить скрытые слои" -->
  <symbol id="icon-eye-off" viewBox="0 0 24 24">
    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
    <line x1="2" x2="22" y1="2" y2="22"/>
  </symbol>
  <!-- paint-bucket (lucide) — инструмент "заливки/обводки/эффекты" -->
  <symbol id="icon-paint-bucket" viewBox="0 0 24 24">
    <path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/>
    <path d="m5 2 5 5"/>
    <path d="M2 13h15"/>
    <path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/>
  </symbol>
  <symbol id="icon-alert" viewBox="0 0 24 24">
    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
    <path d="M12 9v4"/>
    <path d="M12 17h.01"/>
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24">
    <path d="M20 6 9 17l-5-5"/>
  </symbol>
  <symbol id="icon-chevron" viewBox="0 0 24 24">
    <path d="m9 18 6-6-6-6"/>
  </symbol>
</svg>

<div id="root">

<!-- ЭКРАН 1 — ничего не выделено -->
<div class="screen" id="screenEmpty">
  <div class="empty-state">
    <span class="empty-icon"><svg class="icon"><use href="#icon-layers"/></svg></span>
    <div>
      <div class="empty-title">Ничего не выделено</div>
      <div class="empty-hint">Выдели на холсте слои, в которых нужно найти скрытое — плагин работает только внутри выделения</div>
    </div>
  </div>
</div>

<!-- ЭКРАН 2 — есть выделение, показываем его и инструменты -->
<div class="screen" id="screenTools" hidden>

  <div class="scope-card">
    <span class="scope-avatar">
      <svg class="icon"><use href="#icon-layers"/></svg>
      <span class="count-badge" id="scopeCountBadge" hidden></span>
    </span>
    <div class="scope-body">
      <div class="scope-title" id="scopeTitle">—</div>
      <div class="scope-meta" id="scopeMeta"></div>
    </div>
  </div>

  <div class="banner success" id="resultBanner" hidden>
    <svg class="icon"><use id="resultIcon" href="#icon-check"/></svg>
    <span id="resultText"></span>
  </div>

  <div class="banner error" id="errorBanner" hidden>
    <svg class="icon"><use href="#icon-alert"/></svg>
    <span id="errorText"></span>
  </div>

  <div class="section">
    <div class="section-label">Слои</div>
    <button class="tool-row" id="cleanLayersBtn" type="button">
      <span class="tool-row-icon">
        <svg class="icon"><use href="#icon-eye-off"/></svg>
        <span class="spinner" hidden></span>
      </span>
      <span class="tool-row-body">
        <span class="tool-row-title">Удалить скрытые слои</span>
        <span class="tool-row-desc">Любые скрытые узлы целиком: фреймы, группы, векторы, текст</span>
      </span>
      <span class="tool-row-chevron"><svg class="icon"><use href="#icon-chevron"/></svg></span>
    </button>
  </div>

  <div class="section">
    <div class="section-label">Заливки</div>
    <button class="tool-row" id="cleanPaintsBtn" type="button">
      <span class="tool-row-icon">
        <svg class="icon"><use href="#icon-paint-bucket"/></svg>
        <span class="spinner" hidden></span>
      </span>
      <span class="tool-row-body">
        <span class="tool-row-title">Удалить скрытые заливки, обводки, эффекты</span>
        <span class="tool-row-desc">Выключенные слои — и заливки под непрозрачным цветом сверху</span>
      </span>
      <span class="tool-row-chevron"><svg class="icon"><use href="#icon-chevron"/></svg></span>
    </button>
  </div>

  <!-- Промо-блок Trace Logo's. Генерируется из
       tools/figma-plugins/_shared/promo-banner.html скриптом
       `node scripts/build-figma-promo.js` — руками между маркерами не
       править, следующий прогон затрёт. Внутри screenTools: на пустом
       экране инструментам нечего показывать, баннеру тоже незачем. -->
  <!-- PROMO:START -->
<style>
  .tlp, .tlp * { box-sizing: border-box; }

  .tlp {
    position: relative;
    overflow: hidden;
    /* Без margin-top: во всех трёх плагинах .tlp — прямой ребёнок .screen
       (display:flex; gap:18px), который уже расставляет 18px между всеми
       своими детьми сам. Собственный margin-top:18px здесь эту дистанцию
       ДУБЛИРОВАЛ (36px вместо 18px) — обнаружено 2026-08-19 замером в
       headless Chrome (scripts нет, разовый puppeteer-скрипт): лишние
       18px не были видны как явный зазор, потому что `html{overflow:
       hidden}` в ui.html плагинов их просто обрезал, забирая высоту у
       #screenTools — из-за этого блок правил (.rules, flex:1) был на
       18px ниже, чем реально помещалось в отведённый бюджет высоты. */
    padding: 14px;
    border: 1px solid #242424;
    border-radius: 14px;
    background: #161616;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    color: #e6e6e6;
  }
  /* Мягкое фиолетовое свечение из правого верхнего угла — единственное
     цветное пятно в блоке, задаёт «это про Trace Logo's», не отвлекая от
     инструментов плагина выше. */
  .tlp::before {
    content: '';
    position: absolute;
    top: -70px;
    right: -50px;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(138, 107, 255, .20), rgba(138, 107, 255, 0) 68%);
    pointer-events: none;
  }
  .tlp > * { position: relative; }

  /* Шапка блока — она же кнопка перехода на сайт: кликается вся строка,
     а не только стрелка. */
  .tlp-head {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 0;
    margin: 0;
    border: none;
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .tlp-icon {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 10px;
    display: block;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .06);
  }
  .tlp-body { min-width: 0; flex: 1; }
  .tlp-title {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: -.01em;
  }
  .tlp-sub {
    display: block;
    margin-top: 2px;
    font-size: 10.5px;
    line-height: 1.4;
    color: #8f8f8f;
  }
  .tlp-arrow {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    border-radius: 50%;
    background: rgba(138, 107, 255, .14);
    color: #a68cff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease, background .15s ease;
  }
  .tlp-arrow svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tlp-head:hover .tlp-arrow { background: rgba(138, 107, 255, .26); transform: translateX(2px); }
  .tlp-head:hover .tlp-title { color: #a68cff; }

  /* Полоска брендов — доказательство «в каталоге реально то, что ищут»:
     шесть узнаваемых логотипов дешевле любого описания. Последний
     элемент — счётчик остальных, чтобы полоска не читалась как «всего
     шесть штук». */
  .tlp-strip {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
  }
  .tlp-logo {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 7px;
    object-fit: contain;
  }
  /* Перенос в 2 строки вместо обрезания многоточием — надёжнее: не
     нужно бороться с тем, что text-overflow:ellipsis не срабатывает на
     флекс-контейнере с текстом прямым потомком, и число не теряется
     при нехватке ширины. .tlp-strip (родитель) — align-items:center,
     поэтому при двух строках картинки-логотипы остаются по центру
     высоты блока сами по себе. */
  .tlp-more {
    flex: 1;
    min-width: 0;
    padding: 0 8px;
    color: #8f8f8f;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.3;
    text-align: left;
  }

  .tlp-donate {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    margin: 10px 0 0;
    padding: 9px 12px;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    background: #1c1c1c;
    color: #b0b0b0;
    font: inherit;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tlp-donate svg { width: 12px; height: 12px; flex-shrink: 0; fill: currentColor; }
  .tlp-donate:hover { background: #232323; border-color: #3a3a3a; color: #e6e6e6; }
  .tlp-donate:hover svg { fill: #ff6b81; }
</style>

<script>
(function () {
  'use strict';

  var root        = document.getElementById('root');
  var screenEmpty = document.getElementById('screenEmpty');
  var screenTools = document.getElementById('screenTools');

  var scopeCountBadge = document.getElementById('scopeCountBadge');
  var scopeTitle       = document.getElementById('scopeTitle');
  var scopeMeta        = document.getElementById('scopeMeta');

  var resultBanner = document.getElementById('resultBanner');
  var resultIcon   = document.getElementById('resultIcon');
  var resultText   = document.getElementById('resultText');
  var errorBanner  = document.getElementById('errorBanner');
  var errorText    = document.getElementById('errorText');

  var cleanLayersBtn = document.getElementById('cleanLayersBtn');
  var cleanPaintsBtn = document.getElementById('cleanPaintsBtn');

  var busy = false;
  var activeBtn = null;
  var resultTimer = null;
  var errorTimer = null;
  // Доступность кнопок независима от busy: busy — "занято прямо сейчас",
  // availability — "есть ли вообще что делать" (посчитано в renderScope).
  // Обе учитываются при выставлении disabled — см. applyAvailability().
  var layersAvailable = false;
  var paintsAvailable = false;

  function plural(n, one, few, many) {
    var mod10 = n % 10;
    var mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return one;
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
    return many;
  }

  // См. фото-редактор — `el.hidden = bool` ненадёжно на SVGElement, через
  // атрибут работает всегда.
  function setHidden(el, value) {
    if (!el) return;
    if (value) el.setAttribute('hidden', ''); else el.removeAttribute('hidden');
  }

  var resizeScheduled = false;
  function fitWindow() {
    if (resizeScheduled) return;
    resizeScheduled = true;
    requestAnimationFrame(function () {
      resizeScheduled = false;
      var contentHeight = root.getBoundingClientRect().height;
      var bodyPadding = 32; // padding: 16px сверху и снизу у body
      parent.postMessage({
        pluginMessage: { type: 'resize', height: Math.ceil(contentHeight + bodyPadding) },
      }, '*');
    });
  }
  if (window.ResizeObserver) {
    new ResizeObserver(fitWindow).observe(root);
  }
  fitWindow();

  function setBusy(value) {
    busy = value;
    applyAvailability();
  }

  // Единая точка, где реально выставляется disabled — учитывает и busy, и
  // "нечего чистить". Кнопка "разблокируется" после busy только если для
  // нового выделения она вообще доступна, а не безусловно всем rows сразу
  // (как было раньше — тогда после клика кнопка "Слои" оживала, даже если
  // чистить было уже нечего).
  function applyAvailability() {
    cleanLayersBtn.disabled = busy || !layersAvailable;
    cleanPaintsBtn.disabled = busy || !paintsAvailable;
    cleanLayersBtn.classList.toggle('is-unavailable', !busy && !layersAvailable);
    cleanPaintsBtn.classList.toggle('is-unavailable', !busy && !paintsAvailable);
  }

  function setLoading(btn, loading) {
    var icon = btn.querySelector('.icon');
    var spinner = btn.querySelector('.spinner');
    setHidden(icon, loading);
    setHidden(spinner, !loading);
  }

  function showError(text) {
    setHidden(resultBanner, true);
    errorText.textContent = text;
    setHidden(errorBanner, false);
    clearTimeout(errorTimer);
    errorTimer = setTimeout(function () { setHidden(errorBanner, true); fitWindow(); }, 4000);
    fitWindow();
  }

  // warn: что-то реально пропущено (сейчас — только скрытые слои внутри
  // инстанса, см. insideInstanceCount) — не ошибка, но стоит увидеть, что
  // тронуто не всё. success: чисто.
  function showResult(text, kind) {
    setHidden(errorBanner, true);
    resultBanner.classList.toggle('warn', kind === 'warn');
    resultBanner.classList.toggle('success', kind !== 'warn');
    resultIcon.setAttribute('href', kind === 'warn' ? '#icon-alert' : '#icon-check');
    resultText.textContent = text;
    setHidden(resultBanner, false);
    clearTimeout(resultTimer);
    resultTimer = setTimeout(function () { setHidden(resultBanner, true); fitWindow(); }, 6000);
    fitWindow();
  }

  // Текст карточки — не "ищем", а прямой ответ, сколько уже нашлось: иначе
  // непонятно, есть ли вообще смысл жать кнопку, пока её не нажал.
  //
  // Показываем только УДАЛИМОЕ число (hiddenLayers минус те, что внутри
  // инстанса и не удалятся Plugin API) — не объясняем пользователю в
  // карточке ПОЧЕМУ часть не в счёте, просто честно считаем то, что кнопка
  // реально удалит. Причина ("внутри инстанса") — техническая деталь,
  // видна в баннере результата после клика, если пригодится, а на этапе
  // "сколько чистить" только шумит.
  function countsText(hiddenLayers, hiddenPaints, insideInstance) {
    var parts = [];
    var removable = hiddenLayers - insideInstance;
    if (removable > 0) {
      parts.push(removable + ' ' + plural(removable, 'скрытый слой', 'скрытых слоя', 'скрытых слоёв'));
    }
    if (hiddenPaints > 0) {
      parts.push(hiddenPaints + ' ' + plural(hiddenPaints, 'скрытая заливка', 'скрытые заливки', 'скрытых заливок'));
    }
    return parts.length ? parts.join(', ') : 'скрытого не найдено';
  }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function renderScope(count, hiddenLayers, hiddenPaints, insideInstance) {
    var hasSelection = count > 0;
    setHidden(screenEmpty, hasSelection);
    setHidden(screenTools, !hasSelection);
    if (!hasSelection) { fitWindow(); return; }

    hiddenLayers = hiddenLayers || 0;
    hiddenPaints = hiddenPaints || 0;
    insideInstance = insideInstance || 0;
    scopeCountBadge.textContent = count > 99 ? '99+' : String(count);
    setHidden(scopeCountBadge, false);
    scopeTitle.textContent = count + ' ' + plural(count, 'слой выделен', 'слоя выделено', 'слоёв выделено');
    scopeMeta.textContent = capitalize(countsText(hiddenLayers, hiddenPaints, insideInstance));

    layersAvailable = (hiddenLayers - insideInstance) > 0;
    paintsAvailable = hiddenPaints > 0;
    applyAvailability();

    fitWindow();
  }

  renderScope(0, 0, 0, 0);

  function finishActiveBtn() {
    if (activeBtn) { setLoading(activeBtn, false); activeBtn = null; }
    setBusy(false);
  }

  cleanLayersBtn.addEventListener('click', function () {
    if (busy) return;
    activeBtn = cleanLayersBtn;
    setBusy(true);
    setLoading(cleanLayersBtn, true);
    parent.postMessage({ pluginMessage: { type: 'clean-hidden-layers' } }, '*');
  });

  cleanPaintsBtn.addEventListener('click', function () {
    if (busy) return;
    activeBtn = cleanPaintsBtn;
    setBusy(true);
    setLoading(cleanPaintsBtn, true);
    parent.postMessage({ pluginMessage: { type: 'clean-hidden-paints' } }, '*');
  });

  window.onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'scope-info') {
      renderScope(msg.selectionCount, msg.hiddenLayers, msg.hiddenPaints, msg.insideInstanceCount);
      return;
    }

    if (msg.type === 'clean-layers-done') {
      // insideInstanceCount технической причиной ("часть лежала внутри
      // инстанса") пользователя не грузим — это уже отражено тем, что
      // кнопка вообще была недоступна/доступна по факту удалимого числа
      // (см. layersAvailable). В баннере — только результат и реальные
      // ошибки, если были.
      var parts = ['Удалено слоёв: ' + msg.removed];
      if (msg.failed) parts.push('ошибок: ' + msg.failed);
      showResult(parts.join(', '), msg.failed ? 'warn' : 'success');
      finishActiveBtn();
      return;
    }

    if (msg.type === 'clean-paints-done') {
      var stats = msg.stats;
      var total = stats.fills + stats.strokes + stats.effects;
      showResult('Удалено скрытых слоёв: ' + total, 'success');
      finishActiveBtn();
      return;
    }

    if (msg.type === 'error') {
      showError(msg.message);
      finishActiveBtn();
      return;
    }
  };

})();
</script>
</body>
</html>
