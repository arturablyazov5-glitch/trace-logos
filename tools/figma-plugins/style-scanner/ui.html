<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  /* ── Цвета — тёмная тема, токены сайта Trace Logo's: значения взяты
     буквально из clean-layers/ui.html, чтобы три плагина читались как один
     набор, а не три разных панели. Структура — тоже оттуда: два экрана
     ([hidden] c !important), #root вместо body для высоты, ResizeObserver →
     figma.ui.resize. Обоснования этих приёмов см. в clean-layers/photo-editor,
     здесь не дублируем. ── */
  :root {
    --accent: #8a6bff;
    --accent-soft: rgba(138, 107, 255, 0.14);
    --danger: #e5484d;
    --danger-soft: rgba(229, 72, 77, 0.14);
    --warn: #f5b544;
    --warn-soft: rgba(245, 181, 68, 0.14);
    --text: #e5e5e5;
    --text-dim: #888;
    --text-faint: #666;
    --page-bg: #111111;
    --card-bg: #161616;
    --border: #222222;
    --chip-bg: #252525;

    /* Цвет на категорию — та же идея, что цветные точки у переменных в
       самой Figma: категория узнаётся по цвету значка до чтения текста.
       fill намеренно совпадает с --accent — это самая частая находка. */
    --cat-fill: #8a6bff;
    --cat-stroke: #4dabf5;
    --cat-text: #f5b544;
    --cat-effect: #f472b6;
    --cat-grid: #34c98a;
    --cat-token: #22d3ee;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--page-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    font-size: 12px;
    color: var(--text);
  }
  button { font-family: inherit; border: none; background: none; padding: 0; margin: 0; }
  #root { display: flex; flex-direction: column; }

  .icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .screen { display: flex; flex-direction: column; gap: 18px; }

  /* ── Экран 1: пустой стейт ──
     1-в-1 с clean-layers — область действия здесь только явное выделение
     (см. code.js), без него сканировать нечего. */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    justify-content: center;
    gap: 12px;
    min-height: 210px;
    padding: 24px 16px;
  }
  .empty-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: float 2.8s ease-in-out infinite;
  }
  .empty-icon .icon { width: 24px; height: 24px; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .empty-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .empty-hint {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
    max-width: 250px;
    margin-top: 4px;
  }

  /* ── Экран 2: есть выделение — карточка + инструмент + находки ── */
  .scope-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }
  .scope-avatar {
    position: relative;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 11px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scope-avatar .icon { width: 17px; height: 17px; }
  .count-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    /* Нейтральный тёмный чип, а не var(--text): в тёмной теме сам текст
       светлый и для фона бейджа не годится (см. clean-layers). */
    background: var(--chip-bg);
    color: #fff;
    border: 2px solid var(--card-bg);
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scope-body { min-width: 0; flex: 1; }
  .scope-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .scope-meta { margin-top: 2px; font-size: 11px; color: var(--text-dim); }

  .banner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.35;
  }
  .banner .icon { width: 14px; height: 14px; flex-shrink: 0; }
  .banner.success { background: var(--accent-soft); color: var(--accent); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.error { background: var(--danger-soft); color: var(--danger); }

  .section { display: flex; flex-direction: column; gap: 9px; }
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 1px 2px;
  }

  .tool-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 14px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.08s, opacity 0.12s;
  }
  .tool-row:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
  .tool-row:active:not(:disabled) { transform: scale(0.98); }
  .tool-row:disabled { cursor: progress; opacity: 0.45; }
  .tool-row-icon {
    position: relative;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    transition: color 0.12s;
  }
  .tool-row-body { min-width: 0; flex: 1; }
  .tool-row-title { display: block; font-size: 13px; font-weight: 600; color: var(--text); }
  .tool-row-desc { display: block; font-size: 11px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }
  .tool-row-chevron { color: var(--text-faint); flex-shrink: 0; display: flex; }
  .tool-row-chevron .icon { width: 14px; height: 14px; }

  .spinner {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid currentColor;
    border-top-color: transparent;
    opacity: 0.9;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Прогресс живёт внутри самой кнопки-инструмента, а не отдельным экраном:
     тонкая полоска по нижней кромке .tool-row. Так «идёт скан» видно там
     же, где его запустили, и второй экран не нужен. */
  .tool-row-progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    border-radius: 0 0 14px 14px;
    overflow: hidden;
    background: var(--chip-bg);
  }
  .tool-row-progress span {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.15s ease-out;
  }
  .tool-row { position: relative; }

  /* ── Фильтры-категории ── */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .filter-chip .count { opacity: 0.75; }
  .filter-chip[data-cat="all"].active { background: var(--accent-soft); color: var(--accent); }
  .filter-chip[data-cat="fill"].active { background: rgba(138,107,255,0.16); color: var(--cat-fill); }
  .filter-chip[data-cat="stroke"].active { background: rgba(77,171,245,0.16); color: var(--cat-stroke); }
  .filter-chip[data-cat="text"].active { background: rgba(245,181,68,0.16); color: var(--cat-text); }
  .filter-chip[data-cat="effect"].active { background: rgba(244,114,182,0.16); color: var(--cat-effect); }
  .filter-chip[data-cat="grid"].active { background: rgba(52,201,138,0.16); color: var(--cat-grid); }
  .filter-chip[data-cat="token"].active { background: rgba(34,211,238,0.16); color: var(--cat-token); }

  /* ── Список найденного ──
     max-height + прокрутка внутри: окно плагина не должно раздуваться до
     сотен строк, промо-блок под списком обязан оставаться достижимым. */
  .issue-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
    /* Явный overflow-x: hidden — без него браузер сам подставляет
       overflow-x: auto, когда overflow-y не 'visible' (правило CSS
       Overflow §3.1): любой узкий перебор по ширине внутри строки
       (длинное имя тега, путь без переноса) рисовал горизонтальный
       скроллбар на весь список, хотя переносить там нечего — контент и
       так обрезается ellipsis/wrap. */
    overflow-x: hidden;
    padding-right: 2px;
    margin-right: -2px;
  }
  .issue-list::-webkit-scrollbar { width: 4px; }
  .issue-list::-webkit-scrollbar-track { background: transparent; }
  .issue-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  .issue-list::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  .issue-empty-filter {
    padding: 18px;
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
  }

  .issue-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 10px 11px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.08s;
    animation: fadeIn 0.18s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .issue-row:hover, .issue-row.is-focused { background: var(--accent-soft); border-color: transparent; }
  .issue-row:active { transform: scale(0.98); }

  .issue-row-icon {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .issue-row-icon .icon { width: 14px; height: 14px; }
  .issue-row-icon.cat-fill   { background: rgba(138,107,255,0.16); color: var(--cat-fill); }
  .issue-row-icon.cat-stroke { background: rgba(77,171,245,0.16); color: var(--cat-stroke); }
  .issue-row-icon.cat-text   { background: rgba(245,181,68,0.16); color: var(--cat-text); }
  .issue-row-icon.cat-effect { background: rgba(244,114,182,0.16); color: var(--cat-effect); }
  .issue-row-icon.cat-grid   { background: rgba(52,201,138,0.16); color: var(--cat-grid); }
  .issue-row-icon.cat-token  { background: rgba(34,211,238,0.16); color: var(--cat-token); }

  .issue-row-body { min-width: 0; flex: 1; }
  .issue-row-top { display: flex; align-items: center; gap: 6px; }
  .issue-row-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .issue-row-badge {
    flex-shrink: 0;
    min-width: 16px;
    height: 16px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--text-dim);
    font-size: 9px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .issue-row-path {
    margin-top: 1px;
    font-size: 10px;
    color: var(--text-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .issue-row-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    max-width: 168px;
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tag.cat-fill   { background: rgba(138,107,255,0.14); color: var(--cat-fill); }
  .tag.cat-stroke { background: rgba(77,171,245,0.14); color: var(--cat-stroke); }
  .tag.cat-text   { background: rgba(245,181,68,0.14); color: var(--cat-text); }
  .tag.cat-effect { background: rgba(244,114,182,0.14); color: var(--cat-effect); }
  .tag.cat-grid   { background: rgba(52,201,138,0.14); color: var(--cat-grid); }
  .tag.cat-token  { background: rgba(34,211,238,0.14); color: var(--cat-token); }

  .issue-row-chevron { color: var(--text-faint); flex-shrink: 0; display: flex; align-self: center; }
  .issue-row-chevron .icon { width: 14px; height: 14px; }

  .keyboard-hint { font-size: 10px; color: var(--text-faint); text-align: center; }
</style>
</head>
<body>

<!-- Спрайт иконок (lucide, инлайн — networkAccess: none, никаких CDN) -->
<svg style="display:none">
  <!-- search — пустой стейт и сам инструмент -->
  <symbol id="icon-search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="8"/>
    <path d="m21 21-4.3-4.3"/>
  </symbol>
  <!-- library (lucide) — область действия: сканируем на связи с библиотеками -->
  <symbol id="icon-library" viewBox="0 0 24 24">
    <path d="m16 6 4 14"/>
    <path d="M12 6v14"/>
    <path d="M8 8v12"/>
    <path d="M4 4v16"/>
  </symbol>
  <!-- droplet — категория «цвет» (fillStyleId) -->
  <symbol id="icon-droplet" viewBox="0 0 24 24">
    <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>
  </symbol>
  <!-- circle — категория «обводка» (strokeStyleId) -->
  <symbol id="icon-circle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
  </symbol>
  <!-- type — категория «текст» (textStyleId) -->
  <symbol id="icon-type" viewBox="0 0 24 24">
    <polyline points="4 7 4 4 20 4 20 7"/>
    <line x1="9" x2="15" y1="20" y2="20"/>
    <line x1="12" x2="12" y1="4" y2="20"/>
  </symbol>
  <!-- sparkles — категория «эффект» (effectStyleId) -->
  <symbol id="icon-sparkles" viewBox="0 0 24 24">
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
  </symbol>
  <!-- grid — категория «сетка» (gridStyleId) -->
  <symbol id="icon-grid" viewBox="0 0 24 24">
    <rect width="18" height="18" x="3" y="3" rx="2"/>
    <path d="M3 9h18"/>
    <path d="M3 15h18"/>
    <path d="M9 3v18"/>
    <path d="M15 3v18"/>
  </symbol>
  <!-- diamond — категория «токен» (boundVariables), тот же символ, что у
       переменных в самой Figma -->
  <symbol id="icon-diamond" viewBox="0 0 24 24">
    <path d="M12 2 2 12l10 10 10-10z"/>
  </symbol>
  <symbol id="icon-alert" viewBox="0 0 24 24">
    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
    <path d="M12 9v4"/>
    <path d="M12 17h.01"/>
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24">
    <path d="M20 6 9 17l-5-5"/>
  </symbol>
  <symbol id="icon-chevron" viewBox="0 0 24 24">
    <path d="m9 18 6-6-6-6"/>
  </symbol>
</svg>

<div id="root">

<!-- ЭКРАН 1 — ничего не выделено -->
<div class="screen" id="screenEmpty">
  <div class="empty-state">
    <span class="empty-icon"><svg class="icon"><use href="#icon-search"/></svg></span>
    <div>
      <div class="empty-title">Ничего не выделено</div>
      <div class="empty-hint">Выдели на холсте фрейм или слои — плагин работает только внутри выделения</div>
    </div>
  </div>
</div>

<!-- ЭКРАН 2 — есть выделение: карточка, инструмент, находки -->
<div class="screen" id="screenTools" hidden>

  <div class="scope-card">
    <span class="scope-avatar">
      <svg class="icon"><use href="#icon-library"/></svg>
      <span class="count-badge" id="scopeCountBadge" hidden></span>
    </span>
    <div class="scope-body">
      <div class="scope-title" id="scopeTitle">—</div>
      <div class="scope-meta" id="scopeMeta"></div>
    </div>
  </div>

  <div class="banner success" id="resultBanner" hidden>
    <svg class="icon"><use id="resultIcon" href="#icon-check"/></svg>
    <span id="resultText"></span>
  </div>

  <div class="banner error" id="errorBanner" hidden>
    <svg class="icon"><use href="#icon-alert"/></svg>
    <span id="errorText"></span>
  </div>

  <div class="section">
    <div class="section-label">Стили</div>
    <button class="tool-row" id="scanBtn" type="button">
      <span class="tool-row-icon">
        <svg class="icon"><use href="#icon-search"/></svg>
        <span class="spinner" hidden></span>
      </span>
      <span class="tool-row-body">
        <span class="tool-row-title">Найти внешние стили и токены</span>
        <span class="tool-row-desc">Цвет, обводка, текст, эффект, сетка, переменные из чужих библиотек</span>
      </span>
      <span class="tool-row-chevron"><svg class="icon"><use href="#icon-chevron"/></svg></span>
      <span class="tool-row-progress" id="scanProgress" hidden><span id="scanProgressFill"></span></span>
    </button>
  </div>

  <!-- Находки — часть того же экрана, не отдельный: появляются под
       инструментом, которым их нашли, и исчезают при смене выделения
       (старый список к новому выделению уже не относится). -->
  <div class="section" id="resultsSection" hidden>
    <div class="section-label" id="resultsLabel">Найдено</div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="issue-list" id="issueList" tabindex="0"></div>
    <div class="keyboard-hint" id="keyboardHint" hidden>↑↓ — по списку, Enter — перейти к слою</div>
  </div>

  <!-- Промо-блок Trace Logo's. Генерируется из
       tools/figma-plugins/_shared/promo-banner.html скриптом
       `node scripts/build-figma-promo.js` — руками между маркерами не
       править, следующий прогон затрёт. Внутри screenTools: на пустом
       экране инструменту нечего показывать, баннеру тоже незачем. -->
  <!-- PROMO:START -->
<style>
  .tlp, .tlp * { box-sizing: border-box; }

  .tlp {
    position: relative;
    overflow: hidden;
    /* Без margin-top: во всех трёх плагинах .tlp — прямой ребёнок .screen
       (display:flex; gap:18px), который уже расставляет 18px между всеми
       своими детьми сам. Собственный margin-top:18px здесь эту дистанцию
       ДУБЛИРОВАЛ (36px вместо 18px) — обнаружено 2026-08-19 замером в
       headless Chrome (scripts нет, разовый puppeteer-скрипт): лишние
       18px не были видны как явный зазор, потому что `html{overflow:
       hidden}` в ui.html плагинов их просто обрезал, забирая высоту у
       #screenTools — из-за этого блок правил (.rules, flex:1) был на
       18px ниже, чем реально помещалось в отведённый бюджет высоты. */
    padding: 14px;
    border: 1px solid #242424;
    border-radius: 14px;
    background: #161616;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    color: #e6e6e6;
  }
  /* Мягкое фиолетовое свечение из правого верхнего угла — единственное
     цветное пятно в блоке, задаёт «это про Trace Logo's», не отвлекая от
     инструментов плагина выше. */
  .tlp::before {
    content: '';
    position: absolute;
    top: -70px;
    right: -50px;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(138, 107, 255, .20), rgba(138, 107, 255, 0) 68%);
    pointer-events: none;
  }
  .tlp > * { position: relative; }

  /* Шапка блока — она же кнопка перехода на сайт: кликается вся строка,
     а не только стрелка. */
  .tlp-head {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 0;
    margin: 0;
    border: none;
    background: none;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .tlp-icon {
    width: 34px;

    flex-shrink: 0;
    border-radius: 10px;
    display: block;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .06);

  .tlp-body { min-width: 0; flex: 1; }
  .tlp-title {
    display: block;
    font-size: 12.5px;
    font-weight: 600;

  .tlp-sub {
    display: block;
    margin-top: 2px;

    line-height: 1.4;
    color: #8f8f8f;
  }
  .tlp-arrow {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    border-radius: 50%;
    background: rgba(138, 107, 255, .14);
    color: #a68cff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease, background .15s ease;
  }
  .tlp-arrow svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Полоска брендов — доказательство «в каталоге реально то, что ищут»:
     шесть узнаваемых логотипов дешевле любого описания. Последний
     элемент — счётчик остальных, чтобы полоска не читалась как «всего
     шесть штук». */
  .tlp-strip {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
  }
  .tlp-logo {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 7px;
    object-fit: contain;
  }
  /* Перенос в 2 строки вместо обрезания многоточием — надёжнее: не
     нужно бороться с тем, что text-overflow:ellipsis не срабатывает на
     флекс-контейнере с текстом прямым потомком, и число не теряется
     при нехватке ширины. .tlp-strip (родитель) — align-items:center,
     поэтому при двух строках картинки-логотипы остаются по центру
     высоты блока сами по себе. */
  .tlp-more {
    flex: 1;
    min-width: 0;
    padding: 0 8px;
    color: #8f8f8f;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.3;
    text-align: left;

    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    margin: 10px 0 0;
    padding: 9px 12px;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    background: #1c1c1c;
    color: #b0b0b0;
    font: inherit;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tlp-donate svg { width: 12px; height: 12px; flex-shrink: 0; fill: currentColor; }
  .tlp-donate:hover { background: #232323; border-color: #3a3a3a; color: #e6e6e6; }
  .tlp-donate:hover svg { fill: #ff6b81; }

<script>
  // Открытие ссылок только через code.js: в iframe плагина ни
  // <a target="_blank">, ни window.open() не работают — единственный
  // рабочий путь наружу это figma.openExternal() на стороне плагина.
  document.querySelectorAll('.tlp [data-tlp-url]').forEach(function (el) {
    el.addEventListener('click', function () {
      parent.postMessage({ pluginMessage: { type: 'open-url', url: el.getAttribute('data-tlp-url') } }, '*');
    });
  });
</script>

<script>
(function () {
  'use strict';

  var root        = document.getElementById('root');
  var screenEmpty = document.getElementById('screenEmpty');
  var screenTools = document.getElementById('screenTools');

  var scopeCountBadge = document.getElementById('scopeCountBadge');
  var scopeTitle      = document.getElementById('scopeTitle');
  var scopeMeta       = document.getElementById('scopeMeta');

  var resultBanner = document.getElementById('resultBanner');
  var resultIcon   = document.getElementById('resultIcon');
  var resultText   = document.getElementById('resultText');
  var errorBanner  = document.getElementById('errorBanner');
  var errorText    = document.getElementById('errorText');

  var scanBtn          = document.getElementById('scanBtn');
  var scanProgress     = document.getElementById('scanProgress');
  var scanProgressFill = document.getElementById('scanProgressFill');

  var resultsSection = document.getElementById('resultsSection');
  var resultsLabel   = document.getElementById('resultsLabel');
  var filterBar      = document.getElementById('filterBar');
  var issueList      = document.getElementById('issueList');
  var keyboardHint   = document.getElementById('keyboardHint');

  var CATEGORY_LABELS = {
    all: 'Все', fill: 'Цвет', stroke: 'Обводка', text: 'Текст',
    effect: 'Эффект', grid: 'Сетка', token: 'Токен',
  };
  var CATEGORY_ORDER = ['fill', 'stroke', 'text', 'effect', 'grid', 'token'];
  var CATEGORY_ICON = {
    fill: '#icon-droplet', stroke: '#icon-circle', text: '#icon-type',
    effect: '#icon-sparkles', grid: '#icon-grid', token: '#icon-diamond',
  };

  var busy = false;
  var currentIssues = [];
  var currentSummary = null;
  var activeFilter = 'all';
  var focusedIndex = -1;
  var errorTimer = null;
  // Клик по строке сам меняет выделение на холсте (code.js выделяет узел и
  // ведёт к нему камеру) — и поднимает то же 'selection-info', что и живая
  // смена выделения пользователем. Без этого флага список схлопывался бы
  // после первого же перехода, не дав посмотреть вторую находку.
  var focusingNode = false;
  var focusTimer = null;

  function plural(n, one, few, many) {
    var mod10 = n % 10;
    var mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return one;
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
    return many;
  }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // См. clean-layers/photo-editor — `el.hidden = bool` ненадёжно на
  // SVGElement, через атрибут работает всегда.
  function setHidden(el, value) {
    if (!el) return;
    if (value) el.setAttribute('hidden', ''); else el.removeAttribute('hidden');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var resizeScheduled = false;
  function fitWindow() {
    if (resizeScheduled) return;
    resizeScheduled = true;
    requestAnimationFrame(function () {
      resizeScheduled = false;
      var contentHeight = root.getBoundingClientRect().height;
      var bodyPadding = 32; // padding: 16px сверху и снизу у body
      parent.postMessage({
        pluginMessage: { type: 'resize', height: Math.ceil(contentHeight + bodyPadding) },
      }, '*');
    });
  }
  if (window.ResizeObserver) {
    new ResizeObserver(fitWindow).observe(root);
  }
  fitWindow();

  function setBusy(value) {
    busy = value;
    scanBtn.disabled = value;
    var icon = scanBtn.querySelector('.tool-row-icon .icon');
    var spinner = scanBtn.querySelector('.spinner');
    setHidden(icon, value);
    setHidden(spinner, !value);
    setHidden(scanProgress, !value);
    if (!value) scanProgressFill.style.width = '0%';
  }

  function showError(text) {
    setHidden(resultBanner, true);
    errorText.textContent = text;
    setHidden(errorBanner, false);
    clearTimeout(errorTimer);
    errorTimer = setTimeout(function () { setHidden(errorBanner, true); fitWindow(); }, 4000);
    fitWindow();
  }

  // warn — нашлось что чинить, success — чисто. Баннер не гаснет по
  // таймеру (в отличие от clean-layers): под ним лежит список находок, к
  // которому это подпись, а не разовое уведомление о выполненном действии.
  function showResult(text, kind) {
    setHidden(errorBanner, true);
    resultBanner.classList.toggle('warn', kind === 'warn');
    resultBanner.classList.toggle('success', kind !== 'warn');
    resultIcon.setAttribute('href', kind === 'warn' ? '#icon-alert' : '#icon-check');
    resultText.textContent = text;
    setHidden(resultBanner, false);
    fitWindow();
  }

  // ─── Карточка области действия ───
  function renderScope(count, name) {
    var hasSelection = count > 0;
    setHidden(screenEmpty, hasSelection);
    setHidden(screenTools, !hasSelection);
    if (!hasSelection) { fitWindow(); return; }

    scopeCountBadge.textContent = count > 99 ? '99+' : String(count);
    setHidden(scopeCountBadge, false);
    scopeTitle.textContent = count === 1
      ? name
      : count + ' ' + plural(count, 'слой выделен', 'слоя выделено', 'слоёв выделено');
    scopeMeta.textContent = 'Проверю стили и переменные внутри выделения';
    fitWindow();
  }

  // Смена выделения обнуляет прошлый результат: список относился к другим
  // узлам, оставлять его под новой карточкой — врать пользователю.
  function clearResults() {
    currentIssues = [];
    currentSummary = null;
    activeFilter = 'all';
    focusedIndex = -1;
    setHidden(resultsSection, true);
    setHidden(resultBanner, true);
    issueList.innerHTML = '';
    filterBar.innerHTML = '';
  }

  // ─── Находки ───
  function summaryText(summary) {
    var parts = [];
    for (var i = 0; i < CATEGORY_ORDER.length; i++) {
      var cat = CATEGORY_ORDER[i];
      if (summary[cat] > 0) parts.push(summary[cat] + ' ' + CATEGORY_LABELS[cat].toLowerCase());
    }
    return parts.join(', ');
  }

  function buildFilterBar(summary) {
    filterBar.innerHTML = '';
    var cats = ['all'].concat(CATEGORY_ORDER.filter(function (c) { return summary[c] > 0; }));
    // Один-единственный чип «Все» фильтром не является — прячем строку
    // целиком, чтобы не занимала место обманкой.
    if (cats.length <= 2) { setHidden(filterBar, true); return; }
    setHidden(filterBar, false);
    for (var i = 0; i < cats.length; i++) {
      var cat = cats[i];
      var count = cat === 'all' ? summary.total : summary[cat];
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'filter-chip' + (cat === activeFilter ? ' active' : '');
      chip.setAttribute('data-cat', cat);
      chip.innerHTML = CATEGORY_LABELS[cat] + ' <span class="count">' + count + '</span>';
      chip.addEventListener('click', function () {
        activeFilter = this.getAttribute('data-cat');
        buildFilterBar(currentSummary);
        renderIssueList();
      });
      filterBar.appendChild(chip);
    }
  }

  function buildIssueRow(issue) {
    // Иконка строки — категория первой находки: она уже достаточно точно
    // называет, что не так с узлом, отдельная «общая» иконка не нужна.
    var primaryCat = issue.details[0].category;
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'issue-row';

    var tagsHtml = '';
    for (var i = 0; i < issue.details.length; i++) {
      var d = issue.details[i];
      tagsHtml += '<span class="tag cat-' + d.category + '" title="' + escapeHtml(d.field) + ' · ' + escapeHtml(d.styleName) + '">' + escapeHtml(d.styleName) + '</span>';
    }

    row.innerHTML =
      '<span class="issue-row-icon cat-' + primaryCat + '"><svg class="icon"><use href="' + CATEGORY_ICON[primaryCat] + '"/></svg></span>' +
      '<span class="issue-row-body">' +
        '<span class="issue-row-top">' +
          '<span class="issue-row-name">' + escapeHtml(issue.nodeName) + '</span>' +
          (issue.details.length > 1 ? '<span class="issue-row-badge">+' + (issue.details.length - 1) + '</span>' : '') +
        '</span>' +
        (issue.parentPath ? '<span class="issue-row-path">' + escapeHtml(issue.parentPath) + '</span>' : '') +
        '<span class="issue-row-tags">' + tagsHtml + '</span>' +
      '</span>' +
      '<span class="issue-row-chevron"><svg class="icon"><use href="#icon-chevron"/></svg></span>';

    row.addEventListener('click', function () {
      // Флаг снимается либо пришедшим 'selection-info', либо по таймеру:
      // если кликнутый узел УЖЕ был выделен, figma не поднимет
      // 'selectionchange' вовсе, и без таймера флаг застрял бы взведённым —
      // следующую, настоящую смену выделения мы бы тогда проглотили.
      focusingNode = true;
      clearTimeout(focusTimer);
      focusTimer = setTimeout(function () { focusingNode = false; }, 300);
      parent.postMessage({ pluginMessage: { type: 'focus', nodeId: issue.nodeId } }, '*');
    });
    return row;
  }

  function renderIssueList() {
    var filtered = activeFilter === 'all'
      ? currentIssues
      : currentIssues.filter(function (issue) {
          for (var i = 0; i < issue.details.length; i++) {
            if (issue.details[i].category === activeFilter) return true;
          }
          return false;
        });

    focusedIndex = -1;
    issueList.innerHTML = '';
    setHidden(keyboardHint, filtered.length <= 5);

    if (filtered.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'issue-empty-filter';
      empty.textContent = 'В этой категории ничего не найдено';
      issueList.appendChild(empty);
      fitWindow();
      return;
    }

    for (var i = 0; i < filtered.length; i++) issueList.appendChild(buildIssueRow(filtered[i]));
    fitWindow();
  }

  function renderResults(issues, summary, scannedCount) {
    currentIssues = issues;
    currentSummary = summary;
    activeFilter = 'all';

    scopeMeta.textContent = 'Проверено слоёв: ' + scannedCount;

    if (summary.total === 0) {
      setHidden(resultsSection, true);
      showResult('Внешних стилей и токенов не найдено', 'success');
      return;
    }

    showResult(summary.total + ' ' + plural(summary.total, 'находка', 'находки', 'находок') +
      ': ' + summaryText(summary), 'warn');
    resultsLabel.textContent = 'Найдено в ' + issues.length + ' ' +
      plural(issues.length, 'слое', 'слоях', 'слоях');
    buildFilterBar(summary);
    renderIssueList();
    setHidden(resultsSection, false);
    fitWindow();
  }

  // ─── Клавиатурная навигация по списку ───
  issueList.addEventListener('keydown', function (e) {
    var rows = issueList.querySelectorAll('.issue-row');
    if (rows.length === 0) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (focusedIndex >= 0) rows[focusedIndex].classList.remove('is-focused');
      focusedIndex = e.key === 'ArrowDown'
        ? Math.min(focusedIndex + 1, rows.length - 1)
        : Math.max(focusedIndex - 1, 0);
      rows[focusedIndex].classList.add('is-focused');
      rows[focusedIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && focusedIndex >= 0) {
      rows[focusedIndex].click();
    }
  });

  scanBtn.addEventListener('click', function () {
    if (busy) return;
    clearResults();
    setBusy(true);
    parent.postMessage({ pluginMessage: { type: 'scan' } }, '*');
  });

  renderScope(0, '');

  window.onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'selection-info') {
      // Переход к найденному слою — это наш собственный клик, а не смена
      // выделения пользователем: карточку и список не трогаем.
      if (focusingNode) { focusingNode = false; clearTimeout(focusTimer); return; }
      clearResults();
      renderScope(msg.count, msg.name);
      return;
    }

    if (msg.type === 'error') {
      setBusy(false);
      showError(msg.message);
      return;
    }

    if (msg.type === 'scanning') {
      scanProgressFill.style.width = '0%';
      return;
    }

    if (msg.type === 'progress') {
      scanProgressFill.style.width = msg.percent + '%';
      return;
    }

    if (msg.type === 'results') {
      setBusy(false);
      renderResults(msg.issues, msg.summary, msg.scannedCount);
      return;
    }
  };
})();
</script>

</body>
</html>
