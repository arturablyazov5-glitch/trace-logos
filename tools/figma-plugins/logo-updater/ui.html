/* Palette and panel conventions match css/tokens.css and clean-layers/ui.html. */
:root{color-scheme:dark;--bg:#111;--card:#161616;--border:#222;--text:#e5e5e5;--muted:#888;--accent:#8a6bff;--accent-soft:rgba(138,107,255,.14)}
*{box-sizing:border-box}[hidden]{display:none!important}

const SITE='https://trace-logos.ru';
function sha256(bytes){
 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],size=Math.ceil((bytes.length+9)/64)*64,data=new Uint8Array(size);data.set(bytes);data[bytes.length]=128;const view=new DataView(data.buffer);view.setUint32(size-8,Math.floor(bytes.length/0x20000000));view.setUint32(size-4,(bytes.length*8)>>>0);const R=(x,n)=>(x>>>n)|(x<<(32-n)),W=new Int32Array(64);
 for(let off=0;off<size;off+=64){for(let i=0;i<16;i++)W[i]=view.getInt32(off+i*4);for(let i=16;i<64;i++){let x=W[i-15],y=W[i-2];W[i]=(W[i-16]+(R(x,7)^R(x,18)^(x>>>3))+W[i-7]+(R(y,17)^R(y,19)^(y>>>10)))|0;}let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}[a,b,c,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)|0);}

let token=0,checking=false;
const $=id=>document.getElementById(id);
function send(msg){parent.postMessage({pluginMessage:msg},'*');}
function busy(value){checking=value;$('check').disabled=value;$('apply').disabled=value||!document.querySelector('.choice:checked');}
function safeURL(raw,path){const u=new URL(raw,SITE);if(u.origin!==SITE||!u.pathname.startsWith(path))throw Error('Недопустимая ссылка каталога');return u;}
async function request(url){const u=safeURL(url,'/');u.searchParams.set('_trace_check',Date.now().toString());const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const r=await fetch(u.href,{cache:'no-store',credentials:'omit',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);if(new URL(r.url).origin!==SITE)throw Error('Неожиданный адрес ответа');return r;}finally{clearTimeout(timer);}}
const normalize=s=>String(s||'').normalize('NFC').toLowerCase().replace(/ё/g,'е').trim();
function matchCatalog(rows,t){if(t.catalogURL){const same=rows.filter(l=>l.url===t.catalogURL);if(same.length===1)return same[0];}const same=rows.filter(l=>[l.name,l.name_en,l.alt_name,l.alt_name_en].some(n=>n&&normalize(n)===normalize(t.brand)));if(same.length!==1)throw Error(same.length?'Неоднозначное имя в каталоге':'Бренд отсутствует в каталоге');return same[0];}
function full(url){return /(?:^|[-_/])full(?:[-_.]|$)/i.test(new URL(url,SITE).pathname);}
function chooseAsset(l,t){
 const base=l.svgUrl&&!full(l.svgUrl)?{url:l.svgUrl,kind:'svg'}:l.pngUrl&&!full(l.pngUrl)?{url:l.pngUrl,kind:'png'}:null;
 if(base)return base;
 // Never choose old, seasonal or wordmark variants just to have a file.
 const candidates=(l.variants||[]).filter(v=>!v.wide&&!/full|old|стар|20\d\d|промо|promo|tahoe/i.test(v.label||'')).map(v=>v.svgUrl?{url:v.svgUrl,kind:'svg'}:v.pngUrl?{url:v.pngUrl,kind:'png'}:null).filter(a=>a&&!full(a.url));
 if(candidates.length===1)return candidates[0];
 throw Error('Нет однозначного основного варианта без Full');
}
async function download(l,t){
 const a=chooseAsset(l,t);safeURL(a.url,'/assets/logos/');const r=await request(a.url);const bytes=new Uint8Array(await r.arrayBuffer());if(!bytes.length||bytes.length>12*1024*1024)throw Error('Пустой или слишком большой файл');
 const hash=sha256(bytes);
 if(a.kind==='svg'){const svg=new TextDecoder().decode(bytes),doc=new DOMParser().parseFromString(svg,'image/svg+xml');if(doc.querySelector('parsererror')||doc.documentElement.localName!=='svg'||doc.querySelector('script,foreignObject'))throw Error('Некорректный SVG');for(const n of doc.querySelectorAll('*'))for(const at of n.attributes){if(/^on/i.test(at.name))throw Error('Некорректный SVG');if(/(?:href|src)$/i.test(at.name)&&!at.value.startsWith('#')&&!/^data:image\/(png|jpeg|webp);base64,/i.test(at.value))throw Error('SVG с внешними ресурсами');}return {...a,svg,hash,catalogURL:l.url,raster:!!doc.querySelector('image')};}
 if(![137,80,78,71,13,10,26,10].every((n,i)=>bytes[i]===n))throw Error('Файл не является PNG');return {...a,bytes:Array.from(bytes),hash,catalogURL:l.url,raster:true};
}
async function fetchCatalog(msg){
 token=msg.token;$('status').textContent=msg.file+'\nЗагружаю актуальный каталог…';
 const catalog=await (await request(SITE+'/logos.json')).json();if(!Array.isArray(catalog.logos)||!catalog.logos.length)throw Error('Каталог пуст');const logos=catalog.logos.filter(l=>!l.comingSoon&&(l.svgUrl||l.pngUrl));
 const results=new Array(msg.brands.length);let next=0,done=0;$('progress').hidden=false;$('progress').max=msg.brands.length;
 async function worker(){while(next<msg.brands.length){const i=next++,t=msg.brands[i];try{const l=matchCatalog(logos,t);results[i]={brand:t.brand,asset:await download(l,t)};}catch(e){results[i]={brand:t.brand,error:e.name==='AbortError'?'Сайт не ответил за 20 секунд':e.message};}done++;$('progress').value=done;$('status').textContent=msg.file+'\nПроверено '+done+' из '+msg.brands.length+' брендов';}}
 await Promise.all([worker(),worker(),worker(),worker()]);$('status').textContent='Сверяю логотипы с макетом…';send({type:'analyze',token,results});
}
function displayPlan(msg){
 $('progress').hidden=true;$('results').replaceChildren();let changed=0,current=0,skipped=0;
 for(const r of msg.rows){if(r.status==='current'){current++;continue;}if(r.status==='changed')changed++;else skipped++;
 const row=document.createElement('label');row.className='row';if(r.status==='changed'){const c=document.createElement('input');c.type='checkbox';c.className='choice';c.value=r.id;c.checked=true;c.onchange=()=>busy(false);row.append(c);}const body=document.createElement('div');body.className='body';const title=document.createElement('strong');title.textContent=r.brand;body.append(title);const sub=document.createElement('small');sub.textContent=r.status==='changed'?r.copies+' копий · библиотека и обложка при наличии':r.reason;body.append(sub);const badge=document.createElement('span');badge.className='badge'+(r.status==='skipped'?' skip':'');badge.textContent=r.status==='changed'?'Обновление':'Пропущен';row.append(body,badge);$('results').append(row);}
 $('status').textContent=changed?'Найдено обновлений: '+changed:skipped?'Проверка завершена. Есть пропущенные логотипы.':'Все найденные логотипы актуальны.';$('summary').textContent='Актуально: '+current+' · Обновления: '+changed+' · Пропущено: '+skipped;$('apply').hidden=!changed;busy(false);
}
$('check').onclick=()=>{busy(true);$('apply').hidden=true;$('results').replaceChildren();$('summary').textContent='';$('status').textContent='Читаю логотипы в файле…';send({type:'scan'});};
$('apply').onclick=()=>{const ids=Array.from(document.querySelectorAll('.choice:checked')).map(c=>c.value);if(!ids.length)return;busy(true);$('status').textContent='Обновляю выбранные логотипы…';send({type:'apply',token,ids});};
async function samePixels(a,b){
  const decode=async bytes=>{const bitmap=await createImageBitmap(new Blob([new Uint8Array(bytes)],{type:'image/png'}));const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0);bitmap.close();return {w:canvas.width,h:canvas.height,pixels:ctx.getImageData(0,0,canvas.width,canvas.height).data};};
  const x=await decode(a),y=await decode(b);if(x.w!==y.w||x.h!==y.h)return false;let error=0;
  // Bootstrap only: tolerate subpixel rounding from old imports, compare premultiplied color.
  for(let i=0;i<x.pixels.length;i+=4){const ax=x.pixels[i+3]/255,ay=y.pixels[i+3]/255;for(let k=0;k<3;k++)error+=Math.abs(x.pixels[i+k]*ax-y.pixels[i+k]*ay);error+=Math.abs(x.pixels[i+3]-y.pixels[i+3]);}
  return error/x.pixels.length<=0.1;
}
onmessage=async e=>{const m=e.data.pluginMessage;if(!m)return;try{if(m.type==='compare-render'){let same=false;try{same=await samePixels(m.a,m.b);}finally{send({type:'compare-result',id:m.id,same});}return;}else if(m.type==='targets')await fetchCatalog(m);else if(m.type==='plan')displayPlan(m);else if(m.type==='done'){const ok=m.reports.filter(r=>!r.error),failed=m.reports.filter(r=>r.error);$('apply').hidden=true;$('results').replaceChildren();$('status').textContent='Обновлено брендов: '+ok.length+'\nЗаменено копий: '+ok.reduce((s,r)=>s+r.updated,0)+(failed.length?'\nПропущено: '+failed.map(r=>r.brand+' — '+r.error).join('; '):'')+'\nПовторная проверка доступна. Отмена — ⌘Z / Ctrl+Z.';busy(false);}else if(m.type==='error')throw Error(m.message);}catch(err){$('progress').hidden=true;$('status').textContent='Проверка остановлена: '+err.message;busy(false);}};
if($('check').click)$('check').click();
</script></body></html>
