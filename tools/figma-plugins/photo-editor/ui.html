<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  /* ── Тёмная тема, токены сайта Trace Logo's (см. css/tokens.css в корне
     репозитория — значения --bg/--bg-card/--accent/--text-N скопированы
     буквально). Раньше тема была светлой (иерархия держалась на контрасте
     "холст чуть темнее белого, плашки чистый белый поверх"); сменено на
     тёмную по прямой просьбе пользователя (2026-08-16, «в стиле сайта»,
     тем же заходом, что и Clean Layers — см. его README, там разбор
     подробнее). На тёмном фоне контраста page-bg/card-bg одной заливкой
     уже не хватает — держится на паре заливка+тонкий бордер (var(--border)),
     тот же приём, что и в карточках самого сайта. ── */
  :root {
    --accent: #8a6bff;
    --accent-soft: rgba(138, 107, 255, 0.14);
    --danger: #e5484d;
    --danger-soft: rgba(229, 72, 77, 0.14);
    --warn: #f5b544;
    --warn-soft: rgba(245, 181, 68, 0.14);
    --text: #e5e5e5;
    --text-dim: #888;
    --text-faint: #666;
    --page-bg: #111111;
    --card-bg: #161616;
    --border: #222222;
    --chip-bg: #252525; /* нейтральный тёмный чип для count-badge — var(--text) теперь светлый, для фона больше не годится */
  }
  * { box-sizing: border-box; }
  /* Обязательное правило: почти все скрываемые блоки ниже — flex/
     inline-flex, а `display` из класса перебивает дефолтный `display:none`
     атрибута [hidden]. Без !important скрытые элементы остаются на экране
     (пустой стейт поверх карточки выделения, пустой баннер ошибки). */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--page-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    font-size: 12px;
    color: var(--text);
  }
  button { font-family: inherit; border: none; background: none; padding: 0; margin: 0; }
  /* Обёртка всего контента — точка измерения высоты окна (см. #root в
     разметке и fitWindow() в скрипте). flex-колонка, чтобы отступы детей
     не схлопывались наружу и высота была ровно суммой содержимого. */
  #root { display: flex; flex-direction: column; }

  /* ── Icon sprite ── */
  .icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  /* ── Панель истории (Отменить/Повторить) ──
     Живёт ПОД обоими экранами (в разметке — после них) и видна независимо
     от текущего выделения: undo/redo откатывает действия плагина над
     узлами, которые сейчас могут быть даже не выделены. Целиком скрыта,
     когда нечего ни отменить, ни повторить — см. refreshHistoryButtons()
     в скрипте (toggles hidden на #historyBar, не только disabled на
     кнопках). */
  /* Отступ сверху даёт gap родительского .screen — своего margin не надо. */
  .history-bar { display: flex; gap: 8px; }
  .history-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 10px;
    border-radius: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s, opacity 0.12s, transform 0.08s;
  }
  .history-btn .icon { width: 14px; height: 14px; }
  .history-btn:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .history-btn:active:not(:disabled) { transform: scale(0.97); }
  .history-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Экраны ──
     Ровно два состояния, взаимоисключающих: "ничего не выбрано" и
     "выбрано — вот инструменты". Раньше хиро/пустой стейт/инструменты
     жили одной колонкой, и пустой стейт дублировал подсказку из хиро,
     а инструменты висели задизейбленными без объяснения. Теперь каждый
     экран сам себе цельная композиция. */
  .screen { display: flex; flex-direction: column; gap: 18px; }

  /* ── Экран 1: пустой стейт.
     Иконка тихонько "дышит" — единственный движущийся элемент экрана,
     глаз сам находит точку входа, отдельный CTA не нужен. ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    justify-content: center;
    gap: 12px;
    min-height: 210px;
    padding: 24px 16px;
  }
  .empty-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: float 2.8s ease-in-out infinite;
  }
  .empty-icon .icon { width: 24px; height: 24px; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .empty-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .empty-hint {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
    max-width: 250px;
    margin-top: 4px;
  }

  /* ── Экран 2, шапка: что именно сейчас выбрано на холсте.
     Один слой — его имя/размеры/поворот из сцены. Несколько — счётчик на
     аватаре и прямая формулировка "применится ко всем": размеры у каждого
     свои, показывать их как один слой было бы враньём. ── */
  .selection-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }
  .selection-avatar {
    position: relative;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 11px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .selection-avatar .icon { width: 17px; height: 17px; }
  .count-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    /* var(--text) в светлой теме была тёмной — годилась и как фон бейджа
       "инверсией". В тёмной теме var(--text) сам светлый, для фона больше
       не подходит — отдельный нейтральный тёмный чип. */
    background: var(--chip-bg);
    color: #fff;
    border: 2px solid var(--card-bg);
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .selection-body { min-width: 0; flex: 1; }
  .selection-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .selection-meta {
    margin-top: 2px;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  #selMeta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rot-badge {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 10px;
    font-weight: 600;
  }

  /* Баннеры: предупреждение (часть выделения не подходит) и ошибка. */
  .banner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.35;
  }
  .banner .icon { width: 14px; height: 14px; flex-shrink: 0; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.error { background: var(--danger-soft); color: var(--danger); }

  /* ── Секции инструментов ──
     Между обрезкой/отражением/восстановлением нет причинно-следственной
     связи (обрезка меняет пиксели, восстановление — только геометрию
     узла, отражение снова пиксели, но независимо от обрезки), поэтому
     каждая — своя подписанная категория, а не общий список. */
  .section { display: flex; flex-direction: column; gap: 9px; }
  /* Обрезка + восстановление + отражение — три отдельные карточки (каждая
     со своей рамкой), но гап между ними должен совпадать с гапом внутри
     .flip-row (8px), а не с чуть более широким дефолтом .section (9px). */
  .section-tight { gap: 8px; }
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 1px 2px;
  }
  /* Разделители убраны — секции и так дышат за счёт увеличенного gap
     между ними (.screen), а лишняя линия на трёх соседних заголовках
     только шумит. Воздух держит структуру лучше, чем линейка. */

  /* Строка-инструмент (обрезка, восстановление): иконка + заголовок +
     описание последствия + шеврон. В светлой теме иерархию давал один
     контраст "белая плашка на сером холсте" (--page-bg), тень/бордер были
     бы лишним дублем. В тёмной теме этого контраста заливкой одной не
     хватает (page-bg/card-bg слишком близки) — добавлен тонкий бордер,
     тот же приём, что и в карточках сайта. Ховер по-прежнему не рамка, а
     акцентная заливка — бордер на ховере просто гасится (border-color:
     transparent), чтобы не спорить с подсветкой. */
  .tool-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 14px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.08s, opacity 0.12s;
  }
  .tool-row:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
  .tool-row:active:not(:disabled) { transform: scale(0.98); }
  .tool-row:disabled { cursor: progress; opacity: 0.45; }
  /* Иконка — акцентного цвета сама по себе (не серая, не в цветной
     плашке-подложке). Единый фирменный синий на всех инструментах —
     это не "плашка под каждую функцию своим цветом" (устаревший приём),
     а просто цвет бренда, вес несёт текст рядом. */
  .tool-row-icon {
    position: relative;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    transition: color 0.12s;
  }
  .tool-row-body { min-width: 0; flex: 1; }
  .tool-row-title { display: block; font-size: 13px; font-weight: 600; color: var(--text); }
  .tool-row-desc { display: block; font-size: 11px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }
  .tool-row-chevron { color: var(--text-faint); flex-shrink: 0; display: flex; }
  .tool-row-chevron .icon { width: 14px; height: 14px; }

  /* Карточки отражения — пара в один ряд: два полюса одной операции,
     симметрия ряда сама сообщает "это пара", без слов. Раньше иконка
     стояла НАД подписью (column) — карточка выходила заметно выше
     остальных кнопок плагина (icon 28 + gap 8 + label + padding 32 ≈ 82px).
     Приведено к той же однострочной раскладке, что у tool-row/history-btn:
     иконка слева, подпись справа, один ряд — по прямой просьбе пользователя
     "сделай это в одну строчку, как все остальные кнопки" (2026-08-20). */
  .flip-row { display: flex; gap: 8px; }
  .flip-card {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    padding: 12px 10px;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.08s, opacity 0.12s;
  }
  .flip-card:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
  .flip-card:active:not(:disabled) { transform: scale(0.97); }
  .flip-card:disabled { cursor: progress; opacity: 0.45; }
  .flip-card-icon {
    position: relative;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    transition: color 0.12s;
  }
  .flip-card-icon .icon { width: 15px; height: 15px; }
  /* Ширина карточки (половина 328px-панели минус gap) уже впритык под
     "По горизонтали" на 12px — без nowrap слово "горизонтали" один раз
     уже переносилось на вторую строку (2026-08-20), из-за чего карточка
     снова становилась выше нужного. nowrap + чуть уменьшенный шрифт
     держат это гарантированно в одну строку при любой ширине панели. */
  .flip-card-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    text-align: left;
    white-space: nowrap;
  }

  /* ── Ховер-свап иконки: на всех пяти кнопках плагина (обрезка,
     восстановление, оба отражения, экспорт) рабочая иконка при наведении
     гладко перетекает во вторую, показывая "что будет" — вдохновлено
     morphicons (MorphIcon), но без самой библиотеки: она React-компонент
     с реальным морфингом SVG path, а плагин — vanilla без сборки и без
     сети (networkAccess: none, CDN недоступен). Тот же визуальный эффект
     сделан двумя наложенными <svg> в одном слоте (.icon-swap-a/-b),
     кроссфейд + лёгкий поворот/масштаб на transition — ничего не
     грузится, ничего не собирается. Тот же приём наложения, что и у
     спиннера ниже (position:relative родитель + position:absolute дети;
     .icon-swap просто добавляет к тому же слоту position:relative явно,
     на случай если это не .tool-row-icon/.flip-card-icon). Какая иконка
     куда свапается — см. комментарий у каждого symbol в спрайте выше. ── */
  .icon-swap { position: relative; }
  .icon-swap-a, .icon-swap-b {
    position: absolute;
    inset: 0;
    margin: auto;
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .icon-swap-b { opacity: 0; transform: scale(0.6) rotate(-40deg); }
  .flip-card:hover:not(:disabled) .icon-swap-a,
  .tool-row:hover:not(:disabled) .icon-swap-a {
    opacity: 0;
    transform: scale(0.6) rotate(40deg);
  }
  .flip-card:hover:not(:disabled) .icon-swap-b,
  .tool-row:hover:not(:disabled) .icon-swap-b {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  /* ── Спиннер: подменяет иконку ровно того инструмента, который запущен,
     в его же цвете (currentColor) — замена читается как "то же место
     занято работой", а не как новый элемент. Абсолютное позиционирование
     внутри слота иконки (родитель — .tool-row-icon/.flip-card-icon,
     оба position:relative) — это не только центровка, а страховка:
     даже если переключение hidden когда-нибудь не сработает, спиннер
     ляжет НА иконку, а не сдвинет её вбок отдельным элементом ряда. ── */
  .spinner {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid currentColor;
    border-top-color: transparent;
    opacity: 0.9;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Спрайт иконок (lucide, инлайн — networkAccess: none, никаких CDN) -->
<svg style="display:none">
  <symbol id="icon-crop" viewBox="0 0 24 24">
    <path d="M6 2v14a2 2 0 0 0 2 2h14"/>
    <path d="M18 22V8a2 2 0 0 0-2-2H2"/>
  </symbol>
  <symbol id="icon-image" viewBox="0 0 24 24">
    <rect width="18" height="18" x="3" y="3" rx="2"/>
    <circle cx="9" cy="9" r="2"/>
    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
  </symbol>
  <symbol id="icon-images" viewBox="0 0 24 24">
    <path d="M18 22H4a2 2 0 0 1-2-2V6"/>
    <path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/>
    <circle cx="12" cy="8" r="2"/>
    <rect width="16" height="16" x="6" y="2" rx="2"/>
  </symbol>
  <symbol id="icon-alert" viewBox="0 0 24 24">
    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
    <path d="M12 9v4"/>
    <path d="M12 17h.01"/>
  </symbol>
  <!-- rotate-ccw (lucide) — "восстановление" читается как отмена/сброс,
       не как рост (прежняя icon-maximize путалась с "увеличить"). -->
  <symbol id="icon-undo" viewBox="0 0 24 24">
    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
    <path d="M3 3v5h5"/>
  </symbol>
  <symbol id="icon-chevron" viewBox="0 0 24 24">
    <path d="m9 18 6-6-6-6"/>
  </symbol>
  <!-- undo-2 / redo-2 (lucide) — крюк-стрелка, отдельно от icon-undo
       (rotate-ccw у "Восстановить оригинал"): та иконка про сброс
       геометрии конкретного фото, эта — про историю действий плагина,
       разные вещи, не должны выглядеть одинаково. -->
  <symbol id="icon-history-undo" viewBox="0 0 24 24">
    <path d="M9 14 4 9l5-5"/>
    <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
  </symbol>
  <symbol id="icon-history-redo" viewBox="0 0 24 24">
    <path d="m15 14 5-5-5-5"/>
    <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/>
  </symbol>
  <!-- flip-horizontal-2 / flip-vertical-2 (lucide) — два треугольника,
       смотрящих друг на друга через пунктирную ось. Читается как "зеркало"
       однозначнее, чем прежняя иконка (её путали с чем-то абстрактным). -->
  <symbol id="icon-flip-h" viewBox="0 0 24 24">
    <path d="m3 7 5 5-5 5V7"/>
    <path d="m21 7-5 5 5 5V7"/>
    <path d="M12 20v2"/>
    <path d="M12 14v2"/>
    <path d="M12 8v2"/>
    <path d="M12 2v2"/>
  </symbol>
  <symbol id="icon-flip-v" viewBox="0 0 24 24">
    <path d="m17 3-5 5-5-5"/>
    <path d="m17 21-5-5-5 5"/>
    <path d="M4 12H2"/>
    <path d="M10 12H8"/>
    <path d="M16 12h-2"/>
    <path d="M22 12h-2"/>
  </symbol>
  <!-- download (lucide) — "Экспорт в WebP" — единственная кнопка плагина,
       которая не редактирует узел, а сохраняет файл на диск, поэтому
       иконка нарочно другая по смыслу (стрелка в лоток), не путается с
       icon-undo ("Восстановить оригинал"). -->
  <symbol id="icon-download" viewBox="0 0 24 24">

     панель и не сжималась). Высота обычного div'а внутри body от размера

<style>
  .tlp, .tlp * { box-sizing: border-box; }

  .tlp {

       своими детьми сам. Собственный margin-top:18px здесь эту дистанцию
       ДУБЛИРОВАЛ (36px вместо 18px) — обнаружено 2026-08-19 замером в
       headless Chrome (scripts нет, разовый puppeteer-скрипт): лишние
       18px не были видны как явный зазор, потому что `html{overflow:
       hidden}` в ui.html плагинов их просто обрезал, забирая высоту у
       #screenTools — из-за этого блок правил (.rules, flex:1) был на

    padding: 14px;
    border: 1px solid #242424;
    border-radius: 14px;
    background: #161616;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;

  /* Мягкое фиолетовое свечение из правого верхнего угла — единственное

     инструментов плагина выше. */
  .tlp::before {
    content: '';
    position: absolute;
    top: -70px;

  .tlp-head:hover .tlp-arrow { background: rgba(138, 107, 255, .26); transform: translateX(2px); }
  .tlp-head:hover .tlp-title { color: #a68cff; }

  .tlp-strip {

    height: 28px;
    flex-shrink: 0;
    border-radius: 7px;

  }
  /* Перенос в 2 строки вместо обрезания многоточием — надёжнее: не
     нужно бороться с тем, что text-overflow:ellipsis не срабатывает на
     флекс-контейнере с текстом прямым потомком, и число не теряется
     при нехватке ширины. .tlp-strip (родитель) — align-items:center,

  .tlp-more {

  }
  .tlp-donate svg { width: 12px; height: 12px; flex-shrink: 0; fill: currentColor; }
  .tlp-donate:hover { background: #232323; border-color: #3a3a3a; color: #e6e6e6; }
  .tlp-donate:hover svg { fill: #ff6b81; }
</style>

<script>
(function () {
  'use strict';

  var root        = document.getElementById('root');
  var screenEmpty = document.getElementById('screenEmpty');
  var screenTools = document.getElementById('screenTools');

  var selAvatarIcon = document.getElementById('selAvatarIcon');
  var selCountBadge = document.getElementById('selCountBadge');
  var selTitle      = document.getElementById('selTitle');
  var selMeta       = document.getElementById('selMeta');
  var selRotBadge   = document.getElementById('selRotBadge');

  var partialBanner = document.getElementById('partialBanner');
  var partialText   = document.getElementById('partialText');
  var errorBanner   = document.getElementById('errorBanner');
  var errorText     = document.getElementById('errorText');

  var cropBtn       = document.getElementById('cropBtn');
  var restoreBtn    = document.getElementById('restoreBtn');
  var flipHBtn      = document.getElementById('flipHBtn');
  var flipVBtn      = document.getElementById('flipVBtn');
  var exportWebpBtn = document.getElementById('exportWebpBtn');
  var historyBar    = document.getElementById('historyBar');
  var undoBtn       = document.getElementById('undoBtn');
  var redoBtn       = document.getElementById('redoBtn');

  var rows = [cropBtn, restoreBtn, flipHBtn, flipVBtn, exportWebpBtn];

  var busy = false;      // идёт операция — блокируем все кнопки
  var pending = 0;
  var doneCount = 0;
  var skipCount = 0;
  var opLabel = 'готово'; // подпись счётчика в финальном статусе текущей операции
  var activeBtn = null;   // какая именно кнопка сейчас крутит спиннер
  var errorTimer = null;
  // История живёт на стороне code.js (там же, где мутируются узлы) —
  // здесь только отражаем canUndo/canRedo, пришедшие оттуда, и не даём
  // жать undo/redo, пока идёт операция (гонка с ещё не осевшей мутацией).
  var historyState = { canUndo: false, canRedo: false };

  // "1 изображение / 2 изображения / 5 изображений"
  function plural(n, one, few, many) {
    var mod10 = n % 10;
    var mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return one;
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
    return many;
  }

  // `el.hidden = bool` — IDL-свойство HTMLElement. У SVGElement (иконки
  // внутри кнопок — <svg>, не <span>) оно не везде надёжно отражается в
  // атрибут: присвоение тихо не срабатывает, элемент остаётся видимым.
  // Через атрибут напрямую работает для любого элемента без исключений.
  function setHidden(el, value) {
    if (!el) return;
    if (value) el.setAttribute('hidden', ''); else el.removeAttribute('hidden');
  }

  // Подгоняем высоту окна плагина под реальный контент — фиксированная
  // высота в showUI() на глаз плывёт между ОС/шрифтами и оставляет
  // пустое место снизу.
  //
  // ДВЕ причины, по которым панель раньше не сжималась (обе исправлены):
  //
  // 1. Мерили document.body.scrollHeight. Body растягивается под вьюпорт,
  //    поэтому при большом окне scrollHeight отдавал высоту ОКНА, а не
  //    контента: окно большое → body большой → просим ту же большую
  //    высоту → окно остаётся большим. Замкнутая петля, из которой нет
  //    выхода вниз. Теперь меряем #root — обычный div, его высота равна
  //    ровно содержимому и от размера окна не зависит (+ padding body).
  //
  // 2. Коалессинг был сделан через cancelAnimationFrame + новый rAF на
  //    КАЖДЫЙ вызов. ResizeObserver дёргает fitWindow() на каждое
  //    изменение layout, а каждый такой вызов ОТМЕНЯЛ ещё не выполнившийся
  //    колбэк и планировал новый — при серии изменений подряд отправка
  //    откладывалась бесконечно и сообщение могло не уйти вообще. Теперь
  //    отмены нет: первый вызов планирует кадр, последующие в пределах
  //    этого же кадра просто игнорируются (флаг), колбэк гарантированно
  //    выполняется и меряет актуальную высоту в момент отправки.
  var resizeScheduled = false;
  function fitWindow() {
    if (resizeScheduled) return;
    resizeScheduled = true;
    requestAnimationFrame(function () {
      resizeScheduled = false;
      var contentHeight = root.getBoundingClientRect().height;
      var bodyPadding = 32; // padding: 16px сверху и снизу у body
      parent.postMessage({
        pluginMessage: { type: 'resize', height: Math.ceil(contentHeight + bodyPadding) },
      }, '*');
    });
  }

  // ResizeObserver — подстраховка на изменения высоты, которые мы могли не
  // учесть явным вызовом fitWindow() (например, будущий код, который
  // забудут им снабдить). Наблюдаем #root, а не body: body меняет высоту
  // вслед за окном, то есть наблюдение за ним ловило бы собственный же
  // ресайз и крутило лишние циклы.
  if (window.ResizeObserver) {
    new ResizeObserver(fitWindow).observe(root);
  }
  fitWindow();

  function setBusy(value) {
    busy = value;
    rows.forEach(function (btn) { btn.disabled = value; });
    refreshHistoryButtons();
  }

  // Undo/redo блокируются на время операции (busy) вне зависимости от
  // canUndo/canRedo — не даём отменить шаг, пока предыдущий ещё не осел
  // на стороне code.js, иначе можно поймать гонку состояний узла.
  //
  // Планка целиком скрыта, если нечего ни отменить, ни повторить — пара
  // вечно задизейбленных кнопок при первом открытии плагина не несёт
  // информации, только шум. Как только появляется хотя бы одно из двух,
  // планка появляется, а состояние disabled уже точечное на сами кнопки.
  function refreshHistoryButtons() {
    var hasAnyHistory = historyState.canUndo || historyState.canRedo;
    setHidden(historyBar, !hasAnyHistory);
    undoBtn.disabled = busy || !historyState.canUndo;
    redoBtn.disabled = busy || !historyState.canRedo;
    fitWindow(); // видимость планки меняет высоту контента
  }

  function setLoading(btn, loading) {
    // querySelectorAll, не querySelector — "Экспорт в WebP" держит ДВЕ
    // наложенные .icon (ховер-свап download↔check, см. .icon-swap в CSS).
    // Старый querySelector брал только первую и вторая иконка на время
    // загрузки оставалась бы видна поверх спиннера.
    var icons = btn.querySelectorAll('.icon');
    for (var i = 0; i < icons.length; i++) setHidden(icons[i], loading);
    var spinner = btn.querySelector('.spinner');
    setHidden(spinner, !loading);
  }

  function showError(text) {
    errorText.textContent = text;
    setHidden(errorBanner, false);
    clearTimeout(errorTimer);
    errorTimer = setTimeout(function () { setHidden(errorBanner, true); fitWindow(); }, 4000);
    fitWindow();
  }

  function renderSelection(count, total, detail) {
    var hasSelection = count > 0;
    setHidden(screenEmpty, hasSelection);
    setHidden(screenTools, !hasSelection);

    if (!hasSelection) {
      setHidden(errorBanner, true);
      fitWindow();
      return;
    }

    if (count === 1 && detail) {
      selAvatarIcon.setAttribute('href', '#icon-image');
      setHidden(selCountBadge, true);
      selTitle.textContent = detail.name || 'Без названия';
      selMeta.textContent = detail.width + ' × ' + detail.height + ' px';
      if (detail.rotation) {
        selRotBadge.textContent = detail.rotation + '°';
        setHidden(selRotBadge, false);
      } else {
        setHidden(selRotBadge, true);
      }
    } else {
      // Несколько изображений: размеры у каждого свои, поэтому вместо них —
      // счётчик и прямое предупреждение, что действие пакетное.
      selAvatarIcon.setAttribute('href', '#icon-images');
      selCountBadge.textContent = count > 99 ? '99+' : String(count);
      setHidden(selCountBadge, false);
      selTitle.textContent = count + ' ' + plural(count, 'изображение', 'изображения', 'изображений');
      selMeta.textContent = 'Действие применится ко всем сразу';
      setHidden(selRotBadge, true);
    }

    // Часть выделения — не картинки (текст, фреймы, несколько видимых
    // image-слоёв в одном узле). Молча их игнорировать нельзя: человек
    // думает, что обработалось всё выделение.
    var ignored = (total || count) - count;
    if (ignored > 0) {
      partialText.textContent = 'Пропущено ' + ignored + ' ' +
        plural(ignored, 'слой', 'слоя', 'слоёв') + ' без подходящего изображения';
      setHidden(partialBanner, false);
    } else {
      setHidden(partialBanner, true);
    }

    fitWindow();
  }

  renderSelection(0, 0, null);

  cropBtn.addEventListener('click', function () {
    if (busy) return;
    activeBtn = cropBtn;
    setBusy(true);
    setLoading(cropBtn, true);
    doneCount = 0;
    skipCount = 0;
    opLabel = 'обрезано';
    parent.postMessage({ pluginMessage: { type: 'start-crop' } }, '*');
  });

  restoreBtn.addEventListener('click', function () {
    if (busy) return;
    activeBtn = restoreBtn;
    setBusy(true);
    setLoading(restoreBtn, true);
    parent.postMessage({ pluginMessage: { type: 'restore-size' } }, '*');
  });

  function startFlip(btn, axis) {
    if (busy) return;
    activeBtn = btn;
    setBusy(true);
    setLoading(btn, true);
    doneCount = 0;
    skipCount = 0;
    opLabel = 'отражено';
    parent.postMessage({ pluginMessage: { type: 'start-flip', axis: axis } }, '*');
  }
  flipHBtn.addEventListener('click', function () { startFlip(flipHBtn, 'h'); });
  flipVBtn.addEventListener('click', function () { startFlip(flipVBtn, 'v'); });

  exportWebpBtn.addEventListener('click', function () {
    if (busy) return;
    activeBtn = exportWebpBtn;
    setBusy(true);
    setLoading(exportWebpBtn, true);
    doneCount = 0;
    skipCount = 0;
    opLabel = 'экспортировано';
    exportResults = [];  // новый прогон — результаты прошлого не в счёт
    isExportRun = true;  // checkAllDone() должен уйти в finalizeExport()
    parent.postMessage({ pluginMessage: { type: 'start-export-webp' } }, '*');
  });

  undoBtn.addEventListener('click', function () {
    if (undoBtn.disabled) return;
    parent.postMessage({ pluginMessage: { type: 'undo' } }, '*');
  });
  redoBtn.addEventListener('click', function () {
    if (redoBtn.disabled) return;
    parent.postMessage({ pluginMessage: { type: 'redo' } }, '*');
  });

  function finishActiveBtn() {
    if (activeBtn) { setLoading(activeBtn, false); activeBtn = null; }
    setBusy(false);
  }

  // ─── Обрезка по содержимому: тот же алгоритм, что и autoCropBtn
  //     в веб-версии инструмента (tools/edit-image/index.html) ───

  function cropToContent(bytes) {
    return new Promise(function (resolve, reject) {
      var blob = new Blob([bytes]);
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth;
        var h = img.naturalHeight;

        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        var data = ctx.getImageData(0, 0, w, h).data;
        var minX = w, minY = h, maxX = 0, maxY = 0;
        var found = false;

        for (var y = 0; y < h; y++) {
          for (var x = 0; x < w; x++) {
            var alpha = data[(y * w + x) * 4 + 3];
            if (alpha > 8) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
              found = true;
            }
          }
        }

        if (!found) {
          resolve({ changed: false });
          return;
        }

        var cropW = maxX - minX + 1;
        var cropH = maxY - minY + 1;

        if (minX === 0 && minY === 0 && cropW === w && cropH === h) {
          resolve({ changed: false });
          return;
        }

        var outCanvas = document.createElement('canvas');
        outCanvas.width = cropW;
        outCanvas.height = cropH;
        outCanvas.getContext('2d').drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

        outCanvas.toBlob(function (croppedBlob) {
          if (!croppedBlob) { reject(new Error('toBlob failed')); return; }
          croppedBlob.arrayBuffer().then(function (buf) {
            resolve({
              changed: true,
              bytes: new Uint8Array(buf),
              cropXFrac: minX / w,
              cropYFrac: minY / h,
              cropWFrac: cropW / w,
              cropHFrac: cropH / h,
            });
          }).catch(reject);
        }, 'image/png');
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('image decode failed'));
      };
      img.src = url;
    });
  }

  // ─── Отражение: полноценный mirror по пикселям (canvas), не фейковый
  //     "поворот на 180°" — geometрия картинки реально перерисовывается
  //     зеркально и перекодируется в новый PNG. ───

  function flipToImage(bytes, axis) {
    return new Promise(function (resolve, reject) {
      var blob = new Blob([bytes]);
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth;
        var h = img.naturalHeight;

        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.save();
        if (axis === 'h') {
          ctx.translate(w, 0);
          ctx.scale(-1, 1);
        } else {
          ctx.translate(0, h);
          ctx.scale(1, -1);
        }
        ctx.drawImage(img, 0, 0);
        ctx.restore();

        canvas.toBlob(function (flippedBlob) {
          if (!flippedBlob) { reject(new Error('toBlob failed')); return; }
          flippedBlob.arrayBuffer().then(function (buf) {
            resolve(new Uint8Array(buf));
          }).catch(reject);
        }, 'image/png');
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('image decode failed'));
      };
      img.src = url;
    });
  }

  // ─── Экспорт в WebP: тот же алгоритм, что и createOutputForFile() в
  //     веб-инструменте (tools/compress-webp/index.html) — картинка на
  //     canvas, canvas.toBlob('image/webp', quality). Фиксированное
  //     качество, без своей ручки-слайдера: у остальных кнопок плагина
  //     тоже нет панели настроек, один клик — один результат со
  //     значением по умолчанию (0.8 — тот же дефолт, что у слайдера
  //     качества на странице сжатия). Экспорт не мутирует узел и не
  //     попадает в историю плагина (undo/redo) — отменять нечего, файл
  //     просто сохраняется на диск. ───
  var WEBP_EXPORT_QUALITY = 0.8;

  // Имя файла — из имени слоя. Запрещённые в именах файлов на Windows/macOS
  // символы заменяются на "_"; пустое/непригодное имя падает на "image".
  function sanitizeFileName(name) {
    var cleaned = String(name || '').replace(/[\\/:*?"<>|]+/g, '_').trim();
    return cleaned || 'image';
  }

  // Скачивание без сети и без диалога "Сохранить как" — временная ссылка
  // с download-атрибутом и синтетический клик, стандартный приём для
  // выгрузки файла из песочницы iframe (networkAccess: none этому не
  // мешает — Blob-URL локальный, наружу ничего не уходит).
  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // Кодирует байты картинки в WebP-Blob. Без скачивания — при нескольких
  // выделенных фото результаты сначала копятся в exportResults и уходят
  // на диск ОДНИМ архивом (см. finalizeExport ниже), поэтому кодирование
  // можно гнать параллельно, не по одному — гонка была именно в скачивании
  // файлов, не в canvas.toBlob().
  function encodeWebp(bytes) {
    return new Promise(function (resolve, reject) {
      var blob = new Blob([bytes]);
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (webpBlob) {
          if (!webpBlob) { reject(new Error('toBlob failed')); return; }
          resolve(webpBlob);
        }, 'image/webp', WEBP_EXPORT_QUALITY);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('image decode failed'));
      };
      img.src = url;
    });
  }

  // ─── Экспорт нескольких фото — один архив, не N файлов ───
  // Прямая запись в выбранную пользователем папку (как в родном экспорте
  // Figma) плагину НЕДОСТУПНА: UI плагина живёт в песочном iframe, где
  // File System Access API (showDirectoryPicker) заблокирован, и
  // единственный путь наружу — браузерное "скачивание". Проверено на
  // практике 2026-08-20: попытка showDirectoryPicker молча проваливалась
  // в скачивание по файлу, Figma Desktop показывала Save-диалог для
  // первого файла и отбрасывала остальные 11, пока диалог был открыт —
  // 12 звуков загрузки, 1 файл на диске.
  //
  // Почему не N скачиваний через <a download>:
  // 1. Electron роняет часть параллельных загрузок — вместо .webp на диске
  //    остаются её временные файлы (".com.figma.Desktop.XXXXXX"), причём
  //    МОЛЧА: клик по <a download> не даёт JS сигнала об успехе записи,
  //    поэтому счётчик показывал "экспортировано 12" при 5 сохранённых.
  // 2. N файлов = N системных диалогов сохранения — на 1000 фото это
  //    1000 подтверждений вручную.
  // Один архив решает обе: одно скачивание, один диалог, один сигнал
  // успеха/провала, никаких гонок. Так же устроены все плагины массового
  // экспорта в Figma — ровно из-за этого ограничения платформы.
  //
  // Одиночное фото уходит обычным .webp — архивировать один файл незачем,
  // а частый сценарий "экспортнуть одну картинку" и так работает надёжно
  // (одна загрузка, один диалог). Выбор варианта — пользовательский,
  // 2026-08-20.
  var exportResults = []; // {name, blob} — копится, пока не пришли все process-export-image
  var isExportRun = false; // true между кликом по кнопке и полным финалом экспорта

  function finalizeExport() {
    isExportRun = false;
    var results = exportResults;
    exportResults = [];

    function finish() {
      var msg = 'Готово: ' + opLabel + ' ' + doneCount + (skipCount ? ', пропущено ' + skipCount : '');
      parent.postMessage({ pluginMessage: { type: 'all-done', message: msg } }, '*');
      finishActiveBtn();
    }

    if (results.length === 0) { finish(); return; }

    if (results.length === 1) {
      downloadBlob(results[0].blob, results[0].name + '.webp');
      finish();
      return;
    }

    // Имена уже прошли sanitizeFileName, но могут совпасть между собой
    // (два слоя с одинаковым названием) — внутри одного .zip второй
    // перезаписал бы первый, поэтому дубли получают суффикс " (2)".
    var zip = new JSZip();
    var usedNames = Object.create(null);
    for (var i = 0; i < results.length; i++) {
      var base = results[i].name;
      var fname = base + '.webp';
      var n = 2;
      while (usedNames[fname]) { fname = base + ' (' + n + ').webp'; n++; }
      usedNames[fname] = true;
      zip.file(fname, results[i].blob);
    }
    zip.generateAsync({ type: 'blob' }).then(function (zipBlob) {
      downloadBlob(zipBlob, 'trace-logos-export.zip');
    }).catch(function () {
      // Архив не собрался — ни один файл фактически не сохранился,
      // счётчик обязан это отражать, а не врать "готово N".
      skipCount += results.length;
      doneCount -= results.length;
    }).finally(finish);
  }

  function checkAllDone() {
    if (pending > 0) return;
    if (isExportRun) { finalizeExport(); return; }
    var msg = 'Готово: ' + opLabel + ' ' + doneCount + (skipCount ? ', пропущено ' + skipCount : '');
    parent.postMessage({ pluginMessage: { type: 'all-done', message: msg } }, '*');
    finishActiveBtn();
  }

  window.onmessage = function (event) {
    var msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'selection-count') {
      // Выделение может смениться прямо во время обработки — тогда экран
      // перерисуем, но кнопки оставим заблокированными до конца операции.
      renderSelection(msg.count, msg.total, msg.detail);
      if (busy) setBusy(true);
      return;
    }

    if (msg.type === 'restore-done') {
      // Итог операции сообщает figma.notify() из code.js — здесь только
      // снимаем спиннер, чтобы не дублировать одно и то же двумя способами.
      finishActiveBtn();
      return;
    }

    if (msg.type === 'history-state') {
      historyState = { canUndo: !!msg.canUndo, canRedo: !!msg.canRedo };
      refreshHistoryButtons();
      return;
    }

    if (msg.type === 'process-image') {
      pending++;
      cropToContent(msg.bytes).then(function (result) {
        if (!result.changed) {
          skipCount++;
          parent.postMessage({ pluginMessage: {
            type: 'cropped-result',
            nodeId: msg.nodeId,
            fillIndex: msg.fillIndex,
            name: msg.name,
            cropXFrac: 0, cropYFrac: 0, cropWFrac: 1, cropHFrac: 1,
          } }, '*');
        } else {
          doneCount++;
          parent.postMessage({ pluginMessage: {
            type: 'cropped-result',
            nodeId: msg.nodeId,
            fillIndex: msg.fillIndex,
            name: msg.name,
            bytes: result.bytes,
            cropXFrac: result.cropXFrac,
            cropYFrac: result.cropYFrac,
            cropWFrac: result.cropWFrac,
            cropHFrac: result.cropHFrac,
          } }, '*');
        }
      }).catch(function () {
        skipCount++;
      }).finally(function () {
        pending--;
        checkAllDone();
      });
      return;
    }

    if (msg.type === 'process-flip') {
      pending++;
      flipToImage(msg.bytes, msg.axis).then(function (bytes) {
        doneCount++;
        parent.postMessage({ pluginMessage: {
          type: 'flipped-result',
          nodeId: msg.nodeId,
          fillIndex: msg.fillIndex,
          name: msg.name,
          bytes: bytes,
        } }, '*');
      }).catch(function () {
        skipCount++;
      }).finally(function () {
        pending--;
        checkAllDone();
      });
      return;
    }

    if (msg.type === 'process-export-image') {
      // Только кодируем и копим — скачивание одно на весь прогон, его
      // делает finalizeExport() когда pending дойдёт до нуля.
      pending++;
      encodeWebp(msg.bytes).then(function (webpBlob) {
        doneCount++;
        exportResults.push({ name: sanitizeFileName(msg.name), blob: webpBlob });
      }).catch(function () {
        skipCount++;
      }).finally(function () {
        pending--;
        checkAllDone();
      });
      return;
    }

    if (msg.type === 'error') {
      // Прогон оборвался, не дойдя до finalizeExport() (например "выдели
      // хотя бы одно изображение") — флаг нельзя оставлять поднятым, иначе
      // следующий НЕ-экспортный прогон уйдёт в finalizeExport().
      isExportRun = false;
      exportResults = [];
      showError(msg.message);
      finishActiveBtn();
      return;
    }
  };

})();
</script>
</body>
</html>
