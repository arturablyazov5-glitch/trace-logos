<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  :root {
    --bg:         #111;
    --bg-card:    #161616;
    --bg-hover:   #1c1c1c;
    --bg-active:  #252525;
    --border:     #222;
    --border-md:  #2a2a2a;
    --border-hover: #383838;
    --text:       #ccc;
    --text-muted: #666;
    --text-dim:   #444;
    --radius:     10px;
    --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --checker-full: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAABGdBTUEAALGPC/xhBQAAAFpJREFUWAntljEKADAIA23p6v//qQ+wfUEcCu1yriEgp0FHRJSJcnehmmWm1Dv/lO4HIg1AAAKjTqm03ea88zMCCEDgO4HV5bS757f+7wRoAAIQ4B9gByAAgQ3pfiDmXmAeEwAAAABJRU5ErkJggg==") 0% 0% / 20px;
  }

  body {
    font-family: var(--font);
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    width: 100%;
    height: 560px;
    max-width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 10px 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-family: var(--font);
    transition: color .12s;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: #fff; }

  /* ── Header ── */
  .header {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
    overflow: hidden;
    width: 100%;
  }

  .search-row {
    display: flex;
    gap: 7px;
    align-items: center;
  }

  .search {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid var(--border-md);
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    background: var(--bg-card);
    color: var(--text);
  }
  .search::placeholder { color: var(--text-dim); }
  .search:focus { border-color: #404040; }

  .filters {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 1px;
  }
  .filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    flex-shrink: 0;
    padding: 4px 12px;
    border: 1px solid var(--border-md);
    border-radius: 20px;
    font-size: 12px;
    background: transparent;
    cursor: pointer;
    white-space: nowrap;
    color: var(--text-muted);
    transition: color .12s, border-color .12s, background .12s;
  }
  .filter-btn:hover { border-color: var(--border-hover); color: #aaa; }
  .filter-btn.active { background: #fff; border-color: #fff; color: #111; }

  /* ── Grid ── */
  .grid-view {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
    min-width: 0;
  }

  .grid {
    overflow-y: auto;
    overflow-x: hidden;
    flex: 1;
    min-width: 0;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .grid::-webkit-scrollbar { width: 4px; }
  .grid::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

  .section-header {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 12px 4px 6px;
  }
  .section-header:first-child { padding-top: 4px; }

  .cards-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4px;
    margin-bottom: 4px;
  }

  .card {
    background: var(--bg-card);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 6px 10px;
    cursor: pointer;
    gap: 8px;
    min-width: 0;
    border: 1px solid var(--border);
    transition: background .12s, border-color .12s;
  }
  .card:hover { background: var(--bg-hover); border-color: var(--border-md); }
  .card:active { background: var(--bg-active); }

  .icon-wrap {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-wrap img {
    width: 48px;
    height: 48px;
    border-radius: 11px;
    object-fit: contain;
  }

  .card-name {
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.2;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    width: 100%;
    padding: 0 2px;
  }
  .card:hover .card-name { color: #aaa; }

  /* ── Detail panel ── */
  .detail-view {
    display: none;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }
  .detail-view.visible { display: flex; }

  .detail-back {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    color: var(--text-muted);
    font-size: 12px;
    flex-shrink: 0;
  }
  .detail-back:hover { color: var(--text); }
  .detail-back svg { flex-shrink: 0; }

  .detail-scroll {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .detail-scroll::-webkit-scrollbar { width: 4px; }
  .detail-scroll::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }

  .detail-preview {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px 16px;
    flex-shrink: 0;
  }
  .detail-preview img {
    width: 100px;
    height: 100px;
    border-radius: 20px;
    object-fit: contain;
  }
  .detail-preview img.wide {
    display: block;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    background: var(--checker-full);
    padding: 16px 20px;
    border-radius: 12px;
  }

  .detail-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    text-align: center;
    padding: 0 16px 3px;
  }

  .detail-cat {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    padding: 0 16px 16px;
  }

  /* Variant cards grid — like on the site */
  .variants-section {
    padding: 0 12px 16px;
  }
  .section-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 8px;
  }
  .variants-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: stretch;
  }
  .variant-card {
    background: #1e1e1e;
    border: 1.5px solid transparent;
    border-radius: 10px;
    display: grid;
    grid-template-rows: 1fr auto;
    justify-items: center;
    padding: 14px 10px 10px;
    gap: 8px;
    cursor: pointer;
    min-width: 80px;
    min-height: 100px;
    flex: 1;
    transition: background .12s, border-color .12s;
  }
  .variant-card:hover { border-color: #333; }
  .variant-card.active { border-color: #444; background: #252525; }
  .variant-card img {
    align-self: center;
    max-width: 100%;
    max-height: 52px;
    width: auto;
    height: auto;
    border-radius: 10px;
    object-fit: contain;
  }
  .variant-card.wide img {
    max-height: 40px;
    border-radius: 4px;
    background: var(--checker-full);
    padding: 6px 10px;
  }
  .variant-card-label {
    align-self: end;
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .variant-card.active .variant-card-label { color: #aaa; }

  /* Ecosystem section */
  .ecosystem-section {
    padding: 0 12px 16px;
  }
  .ecosystem-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 6px;
  }
  .eco-card {
    background: #1e1e1e;
    border: 1.5px solid transparent;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 6px 8px;
    gap: 6px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .eco-card:hover { border-color: #333; background: #222; }
  .eco-card.active { border-color: #444; background: #252525; }
  .eco-card.active .eco-card-label { color: #ccc; }
  .eco-card img { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; }
  .eco-card-label {
    font-size: 10px;
    color: #888;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    line-height: 1.3;
  }

  /* Insert button */
  .detail-footer {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .insert-btn {
    width: 100%;
    padding: 10px;
    background: #fff;
    color: #111;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    transition: opacity .12s;
  }
  .insert-btn:hover { opacity: 0.88; }
  .insert-btn:active { opacity: 0.75; }
  .insert-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── States ── */
  .state {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 20px;
  }
  .state.error { color: #c0392b; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" data-tab="logos">Логотипы</button>
  <button class="tab" data-tab="emoji">Эмодзи</button>
</div>
<div class="header">
  <div class="search-row">
    <input class="search" type="text" placeholder="Поиск..." id="search" autocomplete="off">
  </div>
  <div class="filters" id="filters"></div>
</div>

<!-- Grid view -->
<div class="grid-view" id="gridView">
  <div class="state" id="state">Загрузка...</div>
  <div class="grid" id="grid" style="display:none"></div>
</div>

<!-- Detail view -->
<div class="detail-view" id="detailView">
  <div class="detail-back" id="detailBack">
    <svg width="16" height="16" fill="none" viewBox="0 0 16 16"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Назад
  </div>
  <div class="detail-scroll">
    <div class="detail-preview">
      <img id="detailImg" src="" alt="">
    </div>
    <div class="detail-name" id="detailName"></div>
    <div class="detail-cat" id="detailCat"></div>
    <div class="variants-section" id="variantsSection" style="display:none">
      <div class="section-label">Варианты</div>
      <div class="variants-grid" id="variantsGrid"></div>
    </div>
    <div class="ecosystem-section" id="ecosystemSection" style="display:none">
      <div class="section-label" id="ecosystemLabel">Экосистема</div>
      <div class="ecosystem-grid" id="ecosystemGrid"></div>
    </div>
  </div>
  <div class="detail-footer">
    <button class="insert-btn" id="insertBtn">Вставить в Figma</button>
  </div>
</div>

<script>
const APIS = {
  logos: 'https://rafael-mansurov.github.io/trace-logos/logos.json?v=' + Date.now(),
  emoji: 'https://rafael-mansurov.github.io/trace-logos/emoji.json?v=' + Date.now(),
};

let allLogos = [];
let activeCategory = 'all';
let searchQuery = '';
let currentLogo = null;
let activeTab = 'logos';

// ── Load ──────────────────────────────────────────────────────────────────────

async function load(tab = 'logos') {
  activeTab = tab;
  activeCategory = 'all';
  searchQuery = '';
  document.getElementById('search').value = '';
  document.getElementById('state').style.display = '';
  document.getElementById('state').className = 'state';
  document.getElementById('state').textContent = 'Загрузка...';
  document.getElementById('grid').style.display = 'none';

  try {
    const res = await fetch(APIS[tab]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.logos || data.emoji || []);
    // For logos: filter comingSoon and require svgUrl; for emoji: require pngUrl or svgUrl
    allLogos = tab === 'logos'
      ? list.filter(l => !l.comingSoon && l.svgUrl)
      : list.filter(l => l.pngUrl || l.svgUrl);

    const catMap = new Map([['all', 'Все']]);
    allLogos.forEach(l => {
      if (l.categorySlug && !catMap.has(l.categorySlug))
        catMap.set(l.categorySlug, l.categoryName || l.categorySlug);
    });

    renderFilters(catMap);
    renderGrid();

    document.getElementById('state').style.display = 'none';
    document.getElementById('grid').style.display = 'flex';
  } catch (e) {
    document.getElementById('state').className = 'state error';
    document.getElementById('state').textContent = 'Ошибка: ' + (e.message || e);
  }
}

// ── Tabs ──────────────────────────────────────────────────────────────────────

document.querySelector('.tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab || tab.dataset.tab === activeTab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  load(tab.dataset.tab);
});

// ── Filters ───────────────────────────────────────────────────────────────────

function renderFilters(catMap) {
  const el = document.getElementById('filters');
  el.innerHTML = [...catMap.entries()].map(([slug, name]) => `
    <button class="filter-btn ${slug === 'all' ? 'active' : ''}" data-cat="${slug}">${escHtml(name)}</button>
  `).join('');

  el.addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    activeCategory = btn.dataset.cat;
    el.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  });
}

// ── Grid ──────────────────────────────────────────────────────────────────────

function getFiltered() {
  const q = searchQuery.toLowerCase();
  return allLogos.filter(l => {
    const matchCat = activeCategory === 'all' || l.categorySlug === activeCategory;
    const matchSearch = !q || l.name.toLowerCase().includes(q) || (l.tags && l.tags.toLowerCase().includes(q));
    return matchCat && matchSearch;
  });
}

function renderGrid() {
  const logos = getFiltered();
  const grid = document.getElementById('grid');
  grid.onclick = null;

  if (logos.length === 0) {
    grid.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:140px;color:#444;font-size:13px">Ничего не найдено</div>';
    return;
  }

  window._logos = logos;

  // Group by category when showing all, flat list for single category
  const showSections = activeCategory === 'all' && !searchQuery;

  if (showSections) {
    // Group logos preserving order
    const sections = [];
    const seen = new Map();
    logos.forEach((l, i) => {
      const key = l.categorySlug || '';
      if (!seen.has(key)) { seen.set(key, []); sections.push({ slug: key, name: l.categoryName || key, items: seen.get(key) }); }
      seen.get(key).push({ logo: l, idx: i });
    });

    grid.innerHTML = sections.map(sec => `
      <div class="section-header">${escHtml(sec.name)}</div>
      <div class="cards-row">
        ${sec.items.map(({ logo: l, idx }) => `
          <div class="card" data-idx="${idx}">
            <div class="icon-wrap"><img src="${l.svgUrl || l.pngUrl}" alt="${escAttr(l.name)}" loading="lazy"></div>
            <span class="card-name">${escHtml(l.name)}</span>
          </div>
        `).join('')}
      </div>
    `).join('');
  } else {
    grid.innerHTML = `<div class="cards-row">${logos.map((l, i) => `
      <div class="card" data-idx="${i}">
        <div class="icon-wrap"><img src="${l.svgUrl || l.pngUrl}" alt="${escAttr(l.name)}" loading="lazy"></div>
        <span class="card-name">${escHtml(l.name)}</span>
      </div>
    `).join('')}</div>`;
  }

  grid.onclick = e => {
    const card = e.target.closest('.card');
    if (!card) return;
    openDetail(window._logos[+card.dataset.idx]);
  };
}

// ── Detail ────────────────────────────────────────────────────────────────────

let selectedSvgUrl = null;
let selectedPngUrl = null;
let selectedName = null;

function openDetail(logo) {
  currentLogo = logo;

  document.getElementById('detailName').textContent = logo.name;
  document.getElementById('detailCat').textContent = logo.categoryName || '';

  // Build full variants list (primary + extras)
  const primaryIsPng = !logo.svgUrl && !!logo.pngUrl;
  const allVariants = [
    { label: primaryIsPng ? 'Apple' : 'Иконка', svgUrl: logo.svgUrl || null, pngUrl: logo.pngUrl || null, wide: false, isPng: primaryIsPng },
    ...(logo.variants || []).map(v => ({
      label: v.label || 'Вариант',
      svgUrl: v.svgUrl || null,
      pngUrl: v.pngUrl || null,
      wide: !!v.wide,
      isPng: !v.svgUrl && !!v.pngUrl,
    })),
  ];

  // Render variant cards
  const variantsSection = document.getElementById('variantsSection');
  const variantsGrid = document.getElementById('variantsGrid');
  if (allVariants.length > 1) {
    variantsGrid.innerHTML = '';
    allVariants.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'variant-card' + (v.wide ? ' wide' : '');
      if (i === 0) card.classList.add('active');
      const img = document.createElement('img');
      img.src = v.svgUrl || v.pngUrl;
      img.alt = v.label;
      const lbl = document.createElement('div');
      lbl.className = 'variant-card-label';
      lbl.textContent = v.label;
      card.append(img, lbl);
      card.addEventListener('click', () => selectVariant(v, card, logo.name));
      variantsGrid.appendChild(card);
    });
    variantsSection.style.display = '';
  } else {
    variantsSection.style.display = 'none';
  }

  // Set initial selection
  selectVariant(allVariants[0], variantsGrid.firstChild, logo.name);

  // Ecosystem block
  const ecoSection = document.getElementById('ecosystemSection');
  const ecoGrid = document.getElementById('ecosystemGrid');
  if (logo.ecosystem) {
    const members = allLogos.filter(l => l.ecosystem === logo.ecosystem);
    if (members.length > 1) {
      ecoGrid.innerHTML = '';
      members.forEach(m => {
        const card = document.createElement('div');
        card.className = 'eco-card' + (m.svgUrl === logo.svgUrl ? ' active' : '');
        const img = document.createElement('img');
        img.src = m.svgUrl;
        img.alt = m.name;
        img.loading = 'lazy';
        const lbl = document.createElement('div');
        lbl.className = 'eco-card-label';
        lbl.textContent = m.name;
        card.append(img, lbl);
        card.addEventListener('click', () => openDetail(m));
        ecoGrid.appendChild(card);
      });
      ecoSection.style.display = '';
    } else {
      ecoSection.style.display = 'none';
    }
  } else {
    ecoSection.style.display = 'none';
  }

  document.getElementById('gridView').style.display = 'none';
  document.getElementById('detailView').classList.add('visible');
}

function selectVariant(variant, cardEl, logoName) {
  selectedSvgUrl = variant.svgUrl || null;
  selectedPngUrl = variant.pngUrl || null;
  selectedName = logoName + (variant.label !== 'Иконка' ? ' — ' + variant.label : '');
  const img = document.getElementById('detailImg');
  img.src = variant.svgUrl || variant.pngUrl;
  img.classList.toggle('wide', !!variant.wide);
  document.getElementById('variantsGrid').querySelectorAll('.variant-card').forEach(c => c.classList.remove('active'));
  if (cardEl) cardEl.classList.add('active');
  const btn = document.getElementById('insertBtn');
  btn.textContent = variant.isPng ? 'Вставить PNG в Figma' : 'Вставить SVG в Figma';
}

function closeDetail() {
  document.getElementById('detailView').classList.remove('visible');
  document.getElementById('gridView').style.display = 'flex';
}

document.getElementById('detailBack').onclick = closeDetail;

document.getElementById('insertBtn').onclick = async () => {
  if (!selectedSvgUrl && !selectedPngUrl) return;
  const btn = document.getElementById('insertBtn');
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Загрузка...';
  try {
    if (selectedSvgUrl) {
      const res = await fetch(selectedSvgUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const svg = await res.text();
      parent.postMessage({ pluginMessage: { type: 'insert-svg', svg, name: selectedName } }, '*');
    } else {
      const res = await fetch(selectedPngUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      parent.postMessage({ pluginMessage: { type: 'insert-png', bytes: buf, name: selectedName } }, '*');
    }
    btn.textContent = origText;
    btn.disabled = false;
  } catch (err) {
    btn.textContent = origText;
    btn.disabled = false;
    alert('Не удалось загрузить: ' + err.message);
  }
};

// ── Search ────────────────────────────────────────────────────────────────────

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  if (document.getElementById('detailView').classList.contains('visible')) closeDetail();
  renderGrid();
});

// ── Utils ─────────────────────────────────────────────────────────────────────

function escAttr(s) { return String(s).replace(/"/g, '&quot;'); }
function escHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

load();
</script>
</body>
</html>
