<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{META_DESC}}">
  <meta name="robots" content="index, follow">

  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="alternate" type="text/plain" title="LLMs.txt" href="https://trace-logos.ru/llms.txt">
  <link rel="icon" type="image/png" sizes="32x32" href="{{REL}}favicon-32.png">
  <link rel="apple-touch-icon" href="{{REL}}apple-touch-icon.png">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Trace Logo's">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{META_DESC}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:locale" content="ru_RU">
  <meta property="article:published_time" content="{{DATE_ISO}}">

  <script type="application/ld+json">
  {{JSON_LD}}
  </script>

  <link rel="stylesheet" href="{{REL}}css/seo-page.css">
  <link rel="stylesheet" href="{{REL}}css/blog.css">
  <!-- Yandex.RTB -->
  <script>window.yaContextCb=window.yaContextCb||[]</script>
  <script src="https://yandex.ru/ads/system/context.js" async></script>
</head>
<body>

<header class="site-header">
  <a class="brand" href="{{REL}}" aria-label="Trace Logo's">
    <span class="brand-logo" aria-hidden="true">
      <img src="{{REL}}assets/brand/logo.svg" alt="" width="28" height="28">
    </span>
    <span class="brand-name">Trace Logo's</span>
  </a>
  <a class="back-btn" href="{{REL}}blog/">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Все статьи
  </a>
</header>

<nav class="breadcrumbs" aria-label="Навигация">
  <a href="{{REL}}">Trace Logo's</a><span class="sep">/</span>
  <a href="{{REL}}blog/">Блог</a><span class="sep">/</span>
  <span class="current" aria-current="page">{{H1}}</span>
</nav>

<main>
  <article class="blog-article">
    <header class="blog-article-head">
      <time class="blog-date" datetime="{{DATE_ISO}}">{{DATE_HUMAN}}</time>
      <h1>{{H1}}</h1>
    </header>
    <div class="blog-body">
      {{BODY}}
    </div>
  </article>

  <div class="catalog-cta">
    <div class="catalog-cta-text">
      <span class="catalog-cta-title">Библиотека логотипов и эмодзи</span>
      <span class="catalog-cta-sub">Скачивайте SVG/PNG бесплатно и экспортируйте в Figma</span>
    </div>
    <a class="catalog-cta-link" href="{{REL}}logos/">
      Открыть каталог
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
</main>

<footer>
  Trace Logo's Beta · <a href="{{REL}}" class="footer-link">trace-logos</a>
</footer>

</body>
</html>
