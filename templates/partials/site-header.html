<header class="site-header">
  <a class="brand" href="{{REL}}" aria-label="Trace Logo's">
    <span class="brand-logo" aria-hidden="true">
      <img src="{{REL}}assets/brand/logo.svg" alt="" width="28" height="28">
    </span>
    <span class="brand-name">Trace Logo's</span>
  </a>
  <form class="seo-search-form" id="seo-search-form" role="search" action="{{REL}}{{search_action}}" method="get" data-base="{{REL}}" data-scope="{{search_scope}}">
    <div class="seo-search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="seo-search" name="q" type="text" placeholder="{{search_ph}}" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="seo-search-dropdown">
    </div>
    <div class="seo-search-dropdown" id="seo-search-dropdown"></div>
  </form>
  <a class="back-btn" href="{{REL}}{{back_href}}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    {{back_label}}
  </a>
</header>
