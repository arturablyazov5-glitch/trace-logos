<!DOCTYPE html>
<html lang="ru">
<head>
{{> metrika}}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="blogIndexTitle">Блог Trace Logo's — о логотипах, SVG, эмодзи и брендах</title>
  <meta name="description" content="Статьи о логотипах, форматах SVG и PNG, эмодзи и фирменных цветах брендов. Гайды для дизайнеров и разработчиков." data-i18n-content="blogIndexDesc">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

  <link rel="canonical" href="https://trace-logos.ru/blog/">
  <link rel="alternate" hreflang="ru" href="https://trace-logos.ru/blog/">
  <link rel="alternate" hreflang="en" href="https://trace-logos.ru/en/blog/">
  <link rel="alternate" hreflang="x-default" href="https://trace-logos.ru/blog/">
  <link rel="alternate" type="application/rss+xml" title="Блог Trace Logo's — RSS" href="https://trace-logos.ru/blog/rss.xml" data-i18n-title="blogRssTitle">
  <link rel="alternate" type="text/plain" title="LLMs.txt" href="https://trace-logos.ru/llms.txt">
  <link rel="icon" href="/favicon.ico" sizes="32x32 16x16">
  <link rel="icon" type="image/png" sizes="32x32" href="{{REL}}favicon-32.png">
  <link rel="apple-touch-icon" href="{{REL}}apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Trace Logo's">
  <meta property="og:title" content="Блог Trace Logo's" data-i18n-content="blogOgTitle">
  <meta property="og:description" content="Статьи о логотипах, SVG, эмодзи и фирменных цветах брендов." data-i18n-content="blogOgDesc">
  <meta property="og:url" content="https://trace-logos.ru/blog/">
  <meta property="og:image" content="https://trace-logos.ru/assets/og/home.png">
  <meta property="og:locale" content="ru_RU">

  <script type="application/ld+json">
  {{JSON_LD}}
  </script>

  <link rel="stylesheet" href="{{REL}}css/seo-page.css">
  <link rel="stylesheet" href="{{REL}}css/site-header.css">
  <link rel="stylesheet" href="{{REL}}css/blog.css">
  <link rel="stylesheet" href="{{REL}}css/site-footer.css">
  <!-- Yandex.RTB -->
  <script>window.yaContextCb=window.yaContextCb||[]</script>
  <script src="https://yandex.ru/ads/system/context.js" async></script>
</head>
<body>

{{> nav-header }}

<nav class="breadcrumbs" data-i18n-aria="breadcrumbNavAria" aria-label="Навигация">
  <a href="{{REL}}">Trace Logo's</a><span class="sep">/</span>
  <span class="current" data-i18n="blogSection" aria-current="page">Блог</span>
</nav>

<main>
  <div class="blog-header-row">
    <div class="category-hero">
      <h1 data-i18n="blogIndexH1">Блог о логотипах, SVG и эмодзи</h1>
      <p class="category-desc" data-i18n="blogIndexDesc">О логотипах, форматах SVG и PNG, эмодзи и фирменных цветах брендов. Гайды для дизайнеров и разработчиков.</p>
    </div>

    <div class="blog-toolbar">
      <label for="blog-sort-select" class="blog-sort-label" data-i18n="blogSortLabel">Сортировка</label>
      <select id="blog-sort-select" class="blog-sort-select">
        <option value="new" data-i18n="blogSortNew">Сначала новые</option>
        <option value="old" data-i18n="blogSortOld">Сначала старые</option>
        <option value="popular" data-i18n="blogSortPopular">По популярности</option>
      </select>
    </div>
  </div>

  <div class="blog-list" id="blog-list">
    {{POST_CARDS}}
  </div>
</main>

{{> site-footer}}

<script src="{{REL}}js/blog-sort.js"></script>
</body>
</html>
