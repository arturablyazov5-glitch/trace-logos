<!DOCTYPE html>
<html lang="ru">
<head>
{{> metrika}}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{META_DESC}}">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">

  <link rel="canonical" href="{{CANONICAL_URL}}">
  {{HREFLANG_TAGS}}
  <link rel="alternate" type="application/json" title="Logos JSON" href="https://trace-logos.ru/logos-index.json">
  <link rel="alternate" type="text/plain" title="LLMs.txt" href="https://trace-logos.ru/llms.txt">
  <link rel="icon" href="/favicon.ico" sizes="32x32 16x16">
  <link rel="icon" type="image/png" sizes="32x32" href="{{REL}}favicon-32.png">
  <link rel="apple-touch-icon" href="{{REL}}apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Trace Logo's">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESC}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ru_RU">

  <script type="application/ld+json">
  {{JSON_LD}}
  </script>

  <link rel="stylesheet" href="{{REL}}css/seo-page.css">
  <link rel="stylesheet" href="{{REL}}css/site-header.css">
  <link rel="stylesheet" href="{{REL}}css/emoji-category-page.css">
  <link rel="stylesheet" href="{{REL}}css/logo-card.css">
  <link rel="stylesheet" href="{{REL}}css/collection-page.css">
  <link rel="stylesheet" href="{{REL}}css/site-footer.css">
  <!-- Yandex.RTB -->
  <script>window.yaContextCb=window.yaContextCb||[]</script>
  <script src="https://yandex.ru/ads/system/context.js" async></script>
</head>
<body>

{{> nav-header }}

<nav class="breadcrumbs" data-i18n-aria="breadcrumbNavAria" aria-label="Навигация">
  <a href="{{REL}}">Trace Logo's</a><span class="sep">/</span>
  <a href="{{HOME_REL}}logos/">{{BREADCRUMB_LOGOS}}</a><span class="sep">/</span>
  <span class="current" aria-current="page">{{H1}}</span>
</nav>

<main>
  <div class="category-hero">
    <h1>{{H1}}</h1>
    <p class="category-desc">{{LEAD}}</p>
  </div>

  <div class="collection-grid">
    {{CARDS}}
  </div>
{{INTRO_SECTION}}

{{FAQ_SECTION}}
  <div class="catalog-cta">
    <div class="catalog-cta-text">
      <span class="catalog-cta-title">{{CATALOG_CTA_TITLE_FULL}}</span>
      <span class="catalog-cta-sub">{{CATALOG_CTA_SUB}}</span>
    </div>
    <a class="catalog-cta-link" href="{{HOME_REL}}logos/">
      {{CATALOG_OPEN}}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>

  <div class="seo-ad-block seo-ad-block-bottom">
    <!-- Yandex.RTB R-A-19679616-10 -->
    <div id="yandex_rtb_R-A-19679616-10"></div>
    <script>
    window.yaContextCb.push(() => {
        Ya.Context.AdvManager.render({
            "blockId": "R-A-19679616-10",
            "renderTo": "yandex_rtb_R-A-19679616-10",
            "type": "feed"
        })
    })
    </script>
  </div>
</main>

{{> site-footer}}

</body>
</html>
