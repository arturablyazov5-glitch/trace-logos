<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{META_DESC}}">
  <meta name="robots" content="index, follow">

  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="alternate" type="application/json" title="Emoji JSON" href="https://rafael-mansurov.github.io/trace-logos/emoji-index.json">
  <link rel="alternate" type="text/plain" title="LLMs.txt" href="https://rafael-mansurov.github.io/trace-logos/llms.txt">
  <link rel="icon" type="image/png" sizes="32x32" href="{{REL}}favicon-32.png">
  <link rel="apple-touch-icon" href="{{REL}}apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Trace Logo's">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESC}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:locale" content="ru_RU">

  <script type="application/ld+json">
  {{JSON_LD}}
  </script>

  <link rel="stylesheet" href="{{REL}}css/seo-page.css">
  <link rel="stylesheet" href="{{REL}}css/emoji-seo-page.css">
  <link rel="stylesheet" href="{{REL}}css/emoji-category-page.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="{{REL}}" aria-label="Trace Logo's">
    <span class="brand-logo" aria-hidden="true">
      <img src="{{REL}}assets/brand/logo.svg" alt="" width="28" height="28">
    </span>
    <span class="brand-name">Trace Logo's</span>
  </a>
  <a class="back-btn" href="{{REL}}emoji/">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Все эмодзи
  </a>
</header>

<nav class="breadcrumbs" aria-label="Навигация">
  <a href="{{REL}}">Trace Logo's</a><span class="sep">/</span>
  <a href="{{REL}}emoji/">Эмодзи</a><span class="sep">/</span>
  <span class="current" aria-current="page">{{CATEGORY_NAME}}</span>
</nav>

<main>
  <div class="category-hero">
    <h1><span aria-hidden="true">{{CATEGORY_ICON}}</span> {{H1}}</h1>
    <p class="category-desc">{{LEAD}}</p>
  </div>

  <div class="emoji-cat-grid">
    {{CARDS}}
  </div>

  <div class="catalog-cta">
    <div class="catalog-cta-text">
      <span class="catalog-cta-title">1918 эмодзи в каталоге</span>
      <span class="catalog-cta-sub">Apple, Google и Microsoft — поиск на русском</span>
    </div>
    <a class="catalog-cta-link" href="{{REL}}emoji/">
      Открыть каталог
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
{{FAQ_SECTION}}
</main>

<footer>
  Trace Logo's Beta · <a href="{{REL}}" class="footer-link">trace-logos</a>
</footer>

</body>
</html>
